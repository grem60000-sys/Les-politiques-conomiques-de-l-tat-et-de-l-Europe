<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cours en autonomie · Chapitre 3</title><meta name="description" content="Les politiques économiques de l'État et de l'Europe — parcours guidé d'autoapprentissage, Terminale STMG">
<style>
:root{--navy:#1F3A5F;--navy2:#2C5282;--light:#EAF0F8;--ink:#1B1F24;--grey:#5A6472;--line:#D5DDE8;--bg:#F3F6FA;--card:#fff;
--gold:#B7862A;--goldbg:#FFF6E0;--red:#B23A3A;--redbg:#FCEDED;--green:#2E7D5B;--greenbg:#E8F4EE;--teal:#1F7A8C;--tealbg:#E6F3F6;--violet:#5B4B9A;--violetbg:#F1EDFA;
--f:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;--fd:"Segoe UI Semibold","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--navy);color:#fff;box-shadow:0 2px 12px #0003}
.top .brand{font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand small{display:block;font-weight:400;color:#C9D6EA;font-size:.78rem}
.top .sp{flex:1}.top .bs{display:none}
.prog{display:flex;align-items:center;gap:10px;font-size:.85rem;color:#D6E0EE;white-space:nowrap}
.prog .bar{width:160px;height:8px;border-radius:4px;background:#ffffff26;overflow:hidden}.prog .bar i{display:block;height:100%;background:#F2C14E;transition:width .6s}
.tbtn{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid #ffffff40;background:transparent;color:#fff}
.tbtn:hover{background:#ffffff1a}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1240px;margin:0 auto;gap:28px;padding:22px 18px 80px}
nav.side{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.side h3{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);margin:6px 0 10px}
.navstep{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:12px;border:1px solid transparent;background:none;color:var(--ink);min-height:48px}
.navstep:hover:not(:disabled){background:var(--light)}
.navstep.cur{background:#fff;border-color:var(--line);box-shadow:0 2px 8px #1F3A5F14}
.navstep:disabled{opacity:.45;cursor:not-allowed}
.navstep .k{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--light);color:var(--navy);border:2px solid var(--line)}
.navstep.done .k{background:var(--green);border-color:var(--green);color:#fff}
.navstep.cur .k{border-color:var(--navy)}
.navstep .t{font-size:.9rem;line-height:1.25}.navstep .t small{display:block;color:var(--grey);font-size:.75rem}
.navsecs{margin:2px 0 8px 52px;display:flex;flex-direction:column;gap:2px}
.navsecs a{font-size:.82rem;color:var(--grey);text-decoration:none;padding:3px 6px;border-radius:6px}
.navsecs a.ok::before{content:"✓ ";color:var(--green);font-weight:700}
.navsecs a.lock{opacity:.5}
.navsecs a:hover{background:var(--light);color:var(--navy)}
main{min-width:0;max-width:880px}
.hero{border-radius:22px;background:linear-gradient(135deg,var(--navy),#16304F);color:#fff;padding:30px 30px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(#F2C14E33,transparent 70%)}
.hero .kick{color:#F2C14E;font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.hero h1{font-family:var(--fd);font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.12;margin:.25em 0 .3em}
.hero p{color:#D6E0EE;margin:.3em 0;max-width:60ch}
.hero .pb{margin-top:16px;padding:14px 16px;border-radius:14px;background:#ffffff14;border:1px solid #ffffff2a;font-weight:600;color:#fff}
.hero .pb span{display:block;color:#F2C14E;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;font-weight:600;transition:transform .1s,background .2s}
.btn:hover{background:var(--navy2)}.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--navy)}.btn.ghost:hover{background:var(--light)}
.btn.gold{background:#F2C14E;border-color:#F2C14E;color:#1B1F24}
.btn.sm{min-height:44px;padding:6px 14px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin:18px 0;box-shadow:0 4px 18px #1F3A5F0d}
.card>h2,.card>h3{margin-top:0}
h2.stitle{font-family:var(--fd);color:var(--navy);font-size:1.5rem;line-height:1.2;margin:0 0 6px}
.kicker{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.s5{border-radius:14px;padding:12px;background:var(--light);border-top:4px solid var(--c)}
.s5 b{display:block;color:var(--c);font-size:.95rem}.s5 span{font-size:.82rem;color:var(--grey);line-height:1.4;display:block;margin-top:4px}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.mapc{text-align:left;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:#fff;min-height:120px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.mapc:hover:not(:disabled){border-color:var(--navy);box-shadow:0 6px 18px #1F3A5F1f}
.mapc:disabled{opacity:.5;cursor:not-allowed}
.mapc .k{font-weight:800;color:var(--navy);font-size:1.3rem}
.mapc .st{margin-top:auto;font-size:.8rem;color:var(--grey)}
.mapc .mb{height:6px;border-radius:3px;background:var(--light);overflow:hidden}.mapc .mb i{display:block;height:100%;background:var(--green)}
.mapc.done{border-color:var(--green)}
/* contenu de cours */
.sec{scroll-margin-top:84px}
.sec h3.st2{font-family:var(--fd);color:var(--navy2);font-size:1.25rem;margin:0 0 4px}
.secno{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.1em;color:#fff;background:var(--navy2);padding:2px 8px;border-radius:6px;margin-bottom:6px}
.h3{color:var(--ink);font-size:1.05rem;margin:22px 0 6px}
.box{border-radius:14px;padding:12px 16px;margin:14px 0;border-left:5px solid var(--c);background:var(--b)}
.box .bt{font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box p{margin:.35em 0}.box ul,.box ol{margin:.3em 0;padding-left:1.2em}
.copy{font-size:.7rem;letter-spacing:.04em;text-transform:none;background:var(--c);color:#fff;padding:1px 7px;border-radius:6px}
.box.def{--c:var(--navy);--b:var(--light)}.box.ex{--c:#6B7280;--b:#F3F4F6}.box.retenir{--c:var(--gold);--b:var(--goldbg)}
.box.piege{--c:var(--red);--b:var(--redbg)}.box.methode{--c:var(--green);--b:var(--greenbg)}.box.donnee{--c:var(--teal);--b:var(--tealbg)}
.box.info{--c:#F2C14E;--b:var(--navy);color:#fff}.box.info .bt{color:#F2C14E}
.tw{overflow-x:auto;margin:12px 0;border-radius:12px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem;background:#fff}
th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:600}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{background:var(--light);font-weight:600;color:var(--navy)}
figure{margin:16px 0;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line);text-align:center}
figcaption{font-size:.8rem;color:var(--grey);font-style:italic;margin-top:4px}
.chart{width:100%;height:auto}
.chart .ax{stroke:#5A6472;stroke-width:1.2}.chart .grid{stroke:#E3E8EF}.chart .trend{fill:none;stroke:#9AA5B4;stroke-width:1.5;stroke-dasharray:6 5}
.chart .curve{fill:none;stroke:var(--navy);stroke-width:3;stroke-linejoin:round}
.chart .lab{font-size:12px;fill:#5A6472;font-family:var(--f)}.chart .b{font-weight:700}.chart .it{font-style:italic}.chart .red{fill:var(--red)}.chart .navy{fill:var(--navy)}
.chart .dot.red{fill:var(--red)}.chart .dot.navy{fill:var(--navy)}
figure.anim .curve{stroke-dasharray:2400;stroke-dashoffset:2400}
figure.anim.on .curve{animation:draw 2.6s ease forwards}
figure.anim .dot,figure.anim text.b{opacity:0}
figure.anim.on .dot,figure.anim.on text.b{animation:fade .5s forwards;animation-delay:calc(1s + var(--i,0) * .45s)}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.js-replay{margin-top:6px}
.chain{margin:16px 0;padding:14px;border-radius:14px;background:var(--light);border:1px solid var(--line)}
.chain .ct{font-weight:700;color:var(--navy2);margin-bottom:8px}
.chain .cs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:c}
.cst{counter-increment:c;position:relative;padding:10px 12px 10px 48px;border-radius:12px;background:#fff;border:1.5px solid var(--navy2);opacity:.12;transition:opacity .4s,transform .4s}
.cst::before{content:counter(c);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--navy2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem}
.cst.on{opacity:1;animation:pop .4s}
.cst.on+.cst.on::after{content:"";}
.cbtn{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* widgets */
.widget{margin:16px 0;padding:16px;border-radius:16px;background:#fff;border:2px dashed var(--navy2)}
.widget .wt{font-weight:700;color:var(--navy2);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.widget .wt::before{content:"▶";font-size:.7rem;background:var(--navy2);color:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.waves{display:flex;align-items:flex-end;gap:6px;height:150px;margin:12px 0 6px;padding:0 4px;border-bottom:2px solid var(--line)}
.waves div{flex:1;background:linear-gradient(180deg,var(--navy2),var(--navy));border-radius:6px 6px 0 0;transition:height .5s;position:relative}
.waves div:first-child{background:linear-gradient(180deg,#F2C14E,var(--gold))}
.waves span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--grey);white-space:nowrap}
.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{flex:1;min-width:140px;padding:10px 12px;border-radius:12px;background:var(--light)}
.kpi b{display:block;font-size:1.5rem;color:var(--navy)}.kpi span{font-size:.8rem;color:var(--grey)}
input[type=range]{width:100%;accent-color:var(--navy);min-height:36px}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.gauge{padding:12px;border-radius:12px;background:var(--light);text-align:center;transition:background .4s}
.gauge b{display:block;font-size:.85rem}.gauge i{display:block;font-style:normal;font-size:2rem;line-height:1.2;transition:transform .4s}
.gauge.up{background:var(--greenbg)}.gauge.up i{color:var(--green)}.gauge.dn{background:var(--redbg)}.gauge.dn i{color:var(--red)}
.wexp{min-height:3em;padding:10px 12px;border-radius:10px;background:var(--goldbg);font-size:.92rem}
.crit{display:grid;gap:12px;margin-top:8px}
.crow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;font-size:.88rem}
.ctrack{position:relative;height:30px;border-radius:8px;background:var(--light)}
.ctrack i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--red);width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-weight:700;font-size:.8rem;white-space:nowrap}
.ctrack em{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--green);font-style:normal}
.ctrack em span{position:absolute;top:-18px;left:4px;font-size:.72rem;color:var(--green);font-weight:700;white-space:nowrap}
/* jeux de classement */
.gitem{padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin:8px 0;background:#fff}
.gitem p{margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:.86rem;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.gres{margin-top:10px;padding:10px 14px;border-radius:12px;font-weight:600}
.gres.ok{background:var(--greenbg);color:var(--green)}.gres.ko{background:var(--redbg);color:var(--red)}
/* je vérifie */
.check{margin-top:22px;border-radius:16px;border:2px solid var(--violet);background:var(--violetbg);padding:16px 18px}
.check .ch{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--violet);letter-spacing:.04em;text-transform:uppercase;font-size:.85rem}
.check .ch .score{margin-left:auto;text-transform:none;letter-spacing:0;background:var(--violet);color:#fff;border-radius:8px;padding:2px 10px}
.q{margin:14px 0 6px;padding:12px 14px;border-radius:12px;background:#fff}
.q .qt{font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:46px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.opt .L{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--light);font-weight:700;color:var(--navy);font-size:.85rem}
.opt[aria-pressed=true]{border-color:var(--violet);background:#F7F4FE}.opt[aria-pressed=true] .L{background:var(--violet);color:#fff}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--green);background:var(--greenbg)}.opt.good .L{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:var(--redbg)}.opt.bad .L{background:var(--red);color:#fff}
.opts.vf{grid-template-columns:1fr 1fr}
.fb{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:.9rem}
.fb.ok{background:var(--greenbg)}.fb.ko{background:var(--redbg)}
.fb b{display:block}
.msg{margin-top:10px;font-weight:600;color:var(--violet)}
.locked{padding:18px 22px;border-radius:18px;border:1.5px dashed var(--line);background:#fff;color:var(--grey);display:flex;gap:12px;align-items:center;margin:18px 0}
.locked b{color:var(--ink)}
/* départ / exercices */
.depart{border-radius:16px;padding:16px 18px;background:var(--light);border-left:5px solid var(--navy2)}
.depart textarea,.exq textarea,.argu textarea{width:100%;min-height:84px;margin-top:8px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);font:inherit;resize:vertical;background:#fff}
textarea:focus,input:focus{outline:3px solid #2C528233;border-color:var(--navy2)}
.caps{margin:8px 0 0;padding-left:1.2em}
.exo{border:2px solid var(--teal);background:var(--tealbg)}
.exo .doc{background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0}
.exo .doc b.dt{color:var(--teal)}
.exo .doc table{min-width:520px}.exo .doc td:first-child{background:#fff;color:inherit;font-weight:400}
.src{font-size:.8rem;color:var(--grey);font-style:italic}
.exq{margin:14px 0;padding:12px 14px;border-radius:12px;background:#fff}
.exq .qt{font-weight:600}
.model{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--greenbg);border-left:4px solid var(--green);font-size:.94rem;animation:pop .4s}
.model b.ml{display:block;color:var(--green);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.self{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:.85rem;color:var(--grey)}
.self button{min-height:40px;padding:4px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:.85rem}
.self button[aria-pressed=true][data-v="2"]{background:var(--green);border-color:var(--green);color:#fff}
.self button[aria-pressed=true][data-v="1"]{background:#F2C14E;border-color:#F2C14E}
.self button[aria-pressed=true][data-v="0"]{background:var(--red);border-color:var(--red);color:#fff}
.point{border:2px solid var(--gold);background:var(--goldbg)}
.caprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #E9DDBF}
.caprow:last-child{border-bottom:0}
.caprow .self{margin:0}
.recall{border-radius:14px;padding:12px 16px;background:#fff;border:1px dashed var(--navy2);margin:14px 0}
.next{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:26px 0}
/* bilan */
.res{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--light) 0);position:relative}
.ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}
.ring b{position:relative;z-index:1;font-size:1.6rem;color:var(--navy)}
.diag{display:grid;gap:8px;margin-top:12px}
.drow{display:grid;grid-template-columns:44px minmax(0,1fr) 110px;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--light);font-size:.88rem}
.drow b{color:var(--navy)}.drow .tag{text-align:center;border-radius:8px;padding:3px 6px;font-weight:700;font-size:.78rem}
.tag.ok{background:var(--greenbg);color:var(--green)}.tag.mid{background:var(--goldbg);color:var(--gold)}.tag.ko{background:var(--redbg);color:var(--red)}
.linkbtn{border:0;background:none;color:var(--navy2);text-decoration:underline;padding:0;min-height:auto;font-size:inherit}
.calc{margin:10px 0;padding:12px 14px;border-radius:12px;background:#fff}
.calc input{width:150px;min-height:44px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);font:inherit}
.flash{perspective:1200px;margin:12px auto;max-width:560px}
.fcard{position:relative;height:220px;transform-style:preserve-3d;transition:transform .6s;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:0 8px 24px #1F3A5F22}
.fface.front{background:var(--navy);color:#fff;font-size:1.4rem;font-weight:700}
.fface.front small{display:block;font-size:.8rem;font-weight:400;color:#C9D6EA;margin-top:10px}
.fface.back{background:#fff;border:2px solid var(--navy);transform:rotateY(180deg);font-size:1rem}
.fnav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center}
.argu .stepa{margin:12px 0;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.argu .stepa h4{margin:0;color:var(--navy2)}
.argu .stepa p.hint{margin:4px 0 0;font-size:.85rem;color:var(--grey)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px #0004;z-index:50;animation:pop .3s;font-weight:600}
.drawer-bg{display:none}
@media (max-width:1000px){
  .wrap{grid-template-columns:1fr;padding:14px 16px 70px}
  nav.side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);max-height:none;top:0;background:#fff;z-index:40;padding:18px 14px;box-shadow:4px 0 30px #0003;transform:translateX(-105%);transition:transform .3s}
  nav.side.open{transform:none}
  .drawer-bg.open{display:block;position:fixed;inset:0;background:#0005;z-index:35}
  .prog .bar{width:80px}
  .steps5{grid-template-columns:1fr 1fr}.map{grid-template-columns:1fr 1fr}
  .gauges{grid-template-columns:1fr 1fr}
  .card{padding:16px}

PIB a reculé par rapport à l'année précédente.", "revoir": "Première, thème 2"}], "parts": {"I": {"title": "I. Les fluctuations de l'activité justifient l'intervention de l'État", "pre": "", "secs": [{"key": "I.A", "title": "A. L'activité économique connaît des cycles", "html": "<h4 class=\"h3\">1. Fluctuations et cycles économiques</h4><p>La croissance économique n'est jamais régulière. Le PIB progresse plus ou moins vite selon les années, et il lui arrive de reculer. Ces variations de l'activité autour de sa tendance de long terme sont appelées <b>fluctuations économiques</b>. Lorsqu'elles se succèdent selon une alternance relativement régulière de phases hautes et de phases basses, on parle de <b>cycle économique</b>.</p><div class=\"box def\"><div class=\"bt\">Définition · Fluctuations et cycle économique <span class=\"copy\">✎ à recopier</span></div><p><b>Fluctuations économiques</b> — Variations de court terme de l'activité économique (production, emploi, prix) autour de sa tendance de long terme.</p><p><b>Cycle économique</b> — Succession de phases d'expansion et de contraction de l'activité, qui se répètent dans le temps avec une durée et une amplitude variables.</p></div><figure class=\"anim\"><svg viewBox=\"0 0 720 250\" role=\"img\" aria-label=\"Schéma des phases d'un cycle économique\" class=\"chart\"><line x1=\"50\" y1=\"210\" x2=\"700\" y2=\"210\" class=\"ax\"/><line x1=\"50\" y1=\"210\" x2=\"50\" y2=\"20\" class=\"ax\"/><text x=\"700\" y=\"228\" text-anchor=\"end\" class=\"lab it\">Temps</text><text x=\"44\" y=\"22\" text-anchor=\"end\" class=\"lab it\">PIB</text><polyline points=\"60.0,170.0 63.1,169.5 66.3,169.1 69.5,168.6 72.6,168.1 75.8,167.6 78.9,167.2 82.0,166.7 85.2,166.2 88.3,165.7 91.5,165.2 94.7,164.8 97.8,164.3 101.0,163.8 104.1,163.3 107.2,162.9 110.4,162.4 113.6,161.9 116.7,161.4 119.8,161.0 123.0,160.5 126.1,160.0 129.3,159.6 132.4,159.1 135.6,158.6 138.8,158.1 141.9,157.7 145.1,157.2 148.2,156.7 151.3,156.2 154.5,155.8 157.7,155.3 160.8 6 598.6,71.6 601.8,72.6 605.0,73.7 608.1,74.8 611.2,75.9 614.4,77.1 617.5,78.2 620.7,79.4 623.9,80.7 627.0,81.9 630.1,83.1 633.3,84.4 636.5,85.6 639.6,86.8 642.8,88.0 645.9,89.2 649.1,90.4 652.2,91.6 655.4,92.7 658.5,93.8 661.6,94.9 664.8,95.9 667.9,96.9 671.1,97.8 674.2,98.7 677.4,99.5 680.5,100.3 683.7,101.0 686.9,101.6 690.0,102.2\" class=\"curve\"/><circle cx=\"139.6\" cy=\"124.0\" r=\"5\" class=\"dot red\"/><text x=\"139.6\" y=\"112.0\" text-anchor=\"middle\" class=\"lab b red\">Pic : crise (retournement)</text><circle cx=\"336.6\" cy=\"162.3\" r=\"5\" class=\"dot navy\"/><text x=\"336.6\" y=\"184.3\" text-anchor=\"middle\" class=\"lab b navy\">Creux</text><circle cx=\"533.1\" cy=\"64.7\" r=\"5\" class=\"dot red\"/><text x=\"533.1\" y=\"52.7\" text-anchor=\"middle\" class=\"lab b red\">Pic</text><text x=\"104.1\" y=\"202\" text-anchor=\"middle\" class=\"lab\">Expansion</text><text x=\"236.4\" y=\"202\" text-anchor=\"middle\" class=\"lab\">Récession</text><text x=\"431.7\" y=\"202\" text-anchor=\"middle\" class=\"lab\">Reprise / expansion</text><text x=\"627.0\" y=\"202\" text-anchor=\"middle\" class=\"lab\">Récession</text><line x1=\"80\" y1=\"30\" x2=\"110\" y2=\"30\" class=\"curve\"/><text x=\"116\" y=\"34\" class=\"lab\">PIB effectif</text><line x1=\"210\" y1=\"30\" x2=\"240\" y2=\"30\" class=\"trend\"/><text x=\"246\" y=\"34\" class=\"lab\">Tendance de long terme</text></svg><figcaption>Schéma 1 — Les phases d'un cycle économique autour de la tendance de long terme (représentation simplifiée).</figcaption><button class=\"btn sm ghost js-replay\" type=\"button\">↻ Rejouer l'animation</button></figure><h4 class=\"h3\">2. Les phases du cycle</h4><p>Le programme retient quatre notions. Elles ne décrivent pas la même chose : trois sont des <b>phases</b> (expansion, récession, dépression), la quatrième est un <b>moment de retournement</b> (la crise).</p><div class=\"tw\"><table><thead><tr><th>Notion</th><th>Définition</th><th>Ce qui se passe</th><th>Exemple</th></tr></thead><tbody><tr><td>Expansion</td><td>Phase de croissance soutenue et durable du PIB.</td><td>La production, l'emploi et souvent les prix augmentent ; le chômage recule.</td><td>France 2017 : croissance d'environ 2,3 %, créations d'emplois nombreuses.</td></tr><tr><td>Crise</td><td>Retournement brutal de la conjoncture : point de passage de l'expansion à la contraction.</td><td>Choc soudain : faillites, chute des marchés financiers, gel du crédit.</td><td>Faillite de la banque Lehman Brothers, septembre 2008.</td></tr><tr><td>Récession</td><td>Recul du PIB pendant au moins deux trimestres consécutifs (définition conventionnelle).</td><td>La production baisse, le chômage augmente, l'investissement est reporté.</td><td>France 2009 : recul du PIB d'environ 3 % sur l'année.</td></tr><tr><td>Dépression</td><td>Recul important et durable de la production, souvent accompagné d'une baisse générale des prix (déflation).</td><td>Chômage de masse, faillites en chaîne, spirale baissière des prix et des revenus.</td><td>Grande Dépression des années 1930 aux États-Unis et en Europe.</td></tr></tbody></table></div><div class=\"box piege\"><div class=\"bt\">Attention · Ne pas confondre ralentissement et récession</div><p>Une croissance <b>faible mais positive</b> n'est pas une récession : c'est un <b>ralentissement</b>. En 2026, le gouvernement prévoit une croissance française de 0,5 % : l'activité ralentit, mais le PIB continue d'augmenter. On ne parle de récession que si le PIB <b>diminue</b>.</p></div><h4 class=\"h3\">3. Pourquoi l'économie fluctue-t-elle ?</h4><p>Les fluctuations ont deux grandes origines, qui se combinent souvent.</p><ul><li><b>Des chocs de demande</b> : une baisse brutale de la consommation, de l'investissement ou des exportations réduit les débouchés des entreprises, qui produisent moins. Exemple : le confinement de 2020 a fait chuter la consommation des ménages.</li><li><b>Des chocs d'offre</b> : une hausse brutale des coûts de production (énergie, matières premières) ou une rupture des chaînes d'approvisionnement réduit la capacité des entreprises à produire. Exemple : la hausse du prix de l'énergie en 2022, puis à nouveau en 2026, renchérit les coûts et fait monter les prix.</li></ul><p>Ces chocs se propagent ensuite par un effet d'entraînement : une entreprise qui produit moins réduit ses commandes à ses fournisseurs et embauche moins ; les ménages, inquiets, épargnent davantage ; la baisse de la demande s'auto-entretient.</p>"}, {"key": "I.B", "title": "B. L'État cherche à stabiliser l'activité", "html": "<h4 class=\"h3\">1. Les objectifs de la politique économique : le carré magique</h4><p>La <b>politique économique</b> est l'ensemble des décisions prises par les pouvoirs publics pour orienter l'activité économique vers des objectifs jugés souhaitables. L'économiste Nicholas Kaldor a résumé ces objectifs en quatre indicateurs, représentés par les quatre sommets d'un <b>carré magique</b>.</p><div class=\"tw\"><table><thead><tr><th>Objectif</th><th>Indicateur mesuré</th><th>Situation idéale</th></tr></thead><tbody><tr><td>Croissance économique</td><td>Taux de croissance du PIB en volume</td><td>Croissance forte et régulière</td></tr><tr><td>Plein emploi</td><td>Taux de chômage</td><td>Chômage réduit au chômage frictionnel</td></tr><tr><td>Stabilité des prix</td><td>Taux d'inflation</td><td>Inflation faible et stable (autour de 2 % en zone euro)</td></tr><tr><td>Équilibre extérieur</td><td>Solde des échanges extérieurs en % du PIB</td><td>Solde équilibré ou excédentaire</td></tr></tbody></table></div><div class=\"widget\" data-w=\"carre\"></div><p>Le carré est dit « magique » parce qu'aucun pays n'atteint durablement les quatre objectifs en même temps. Ils sont souvent <b>contradictoires</b> : une relance de la demande stimule la croissance et l'emploi, mais elle peut faire monter les prix et augmenter les importations, donc dégrader le solde extérieur. Toute politique économique est donc un <b>arbitrage</b> entre objectifs.</p><h4 class=\"h3\">2. La politique contracyclique</h4><p>Puisque l'activité fluctue, l'État peut chercher à agir <b>à contre-courant du cycle</b> : soutenir l'activité quand elle ralentit, la freiner quand elle s'emballe. C'est le principe de la politique contracyclique.</p><div class=\"box def\"><div class=\"bt\">Définition · Politique contracyclique <span class=\"copy\">✎ à recopier</span></div><p>Politique économique qui agit en sens inverse de la conjoncture afin d'atténuer l'amplitude des fluctuations : politique de <b>relance</b> en phase de ralentissement ou de récession, politique de <b>rigueur</b> (ou de stabilisation) en phase de surchauffe, lorsque l'inflation s'accélère.</p></div><div class=\"tw\"><table><thead><tr><th>Situation conjoncturelle</th><th>Risque principal</th><th>Orientation contracyclique</th></tr></thead><tbody><tr><td>Ralentissement, récession</td><td>Hausse du chômage, faillites</td><td>Relance : augmenter la demande (plus de dépenses publiques, moins d'impôts, taux d'intérêt plus bas)</td></tr><tr><td>Surchauffe</td><td>Inflation, bulles financières</td><td>Rigueur : freiner la demande (moins de dépenses publiques, plus d'impôts, taux d'intérêt plus élevés)</td></tr></tbody></table></div><div class=\"box piege\"><div class=\"bt\">Attention · Une politique peut aussi être procyclique</div><p>Une politique qui va <b>dans le même sens</b> que le cycle l'amplifie : elle est dite procyclique. Exemple : en 2011-2012, plusieurs pays de la zone euro ont réduit fortement leurs dépenses publiques alors que leur économie était déjà en récession, ce qui a prolongé la crise.</p></div>"}], "ret": "<div class=\"box retenir\"><div class=\"bt\">À retenir — Partie I <span class=\"copy\">✎ à recopier</span></div><ul><li>L'activité connaît des <b>fluctuations</b> qui prennent la forme de <b>cycles</b> : expansion, crise (retournement), récession, parfois dépression.</li><li>Une croissance faible mais positive est un <b>ralentissement</b>, pas une récession.</li><li>Les objectifs de la politique économique se résument par le <b>carré magique</b> : croissance, plein emploi, stabilité des prix, équilibre extérieur — souvent contradictoires.</li><li>La <b>politique contracyclique</b> agit à l'inverse de la conjoncture : relance en récession, rigueur en surchauffe.</li></ul></div>"}, "II": {"title": "II. Les leviers de la politique conjoncturelle", "pre": "<p>Pour stabiliser l'activité à court terme, les pouvoirs publics disposent de deux grands leviers : le budget de l'État (politique budgétaire) et la monnaie (politique monétaire). En zone euro, ils ne sont pas entre les mêmes mains : le budget relève de chaque État, la monnaie relève de la BCE.</p>", "secs": [{"key": "II.A", "title": "A. La politique budgétaire", "html": "<h4 class=\"h3\">1. Définition et instruments</h4><div class=\"box def\"><div class=\"bt\">Définition · Politique budgétaire <span class=\"copy\">✎ à recopier</span></div><p>Action des pouvoirs publics sur l'activité économique par l'intermédiaire du <b>budget de l'État</b> et des administrations publiques : variation des <b>dépenses publiques</b> et des <b>recettes publiques</b> (impôts, taxes, cotisations).</p></div><p>La politique budgétaire dispose donc de deux instruments, qui peuvent être utilisés séparément ou ensemble :</p><ul><li><b>les dépenses publiques</b> : investissements (infrastructures, rénovation énergétique, recherche), dépenses de fonctionnement (rémunération des fonctionnaires), prestations sociales et subventions ;</li><li><b>les prélèvements obligatoires</b> : impôts sur le revenu et sur les sociétés, TVA, cotisations sociales. Baisser un impôt augmente le revenu disponible des ménages ou la rentabilité des entreprises.</li></ul><p>Elle est décidée chaque année par le Parlement, qui vote la <b>loi de finances</b> (budget de l'État) et la loi de financement de la sécurité sociale.</p><h4 class=\"h3\">2. Relance ou stabilisation</h4><div class=\"tw\"><table><thead><tr><th></th><th>Politique budgétaire de relance (expansionniste)</th><th>Politique budgétaire de stabilisation (rigueur)</th></tr></thead><tbody><tr><td>Quand ?</td><td>Ralentissement, récession, chômage élevé</td><td>Surchauffe, inflation, ou dette publique jugée trop élevée</td></tr><tr><td>Comment ?</td><td>Hausse des dépenses publiques et / ou baisse des impôts</td><td>Baisse des dépenses publiques et / ou hausse des impôts</td></tr><tr><td>Effet sur le solde public</td><td>Le déficit public se creuse</td><td>Le déficit public se réduit</td></tr><tr><td>Effet recherché</td><td>Soutenir la demande, la production et l'emploi</td><td>Freiner la demande, contenir l'inflation, assainir les finances publiques</td></tr><tr><td>Exemple</td><td>Plan France Relance (2020) : 100 Md€ sur deux ans, dont rénovation énergétique et soutien à l'industrie</td><td>Projet de loi de finances 2027 : effort annoncé de 54 Md€ pour ramener le déficit de 5,4 % à 5 % du PIB</td></tr></tbody></table></div><h4 class=\"h3\">3. Le mécanisme de relance : l'effet multiplicateur</h4><p>Une dépense publique supplémentaire a un effet sur l'activité qui peut être <b>supérieur à son montant initial</b>. L'État commande, par exemple, la rénovation énergétique d'écoles : les entreprises du bâtiment produisent davantage, embauchent et versent des salaires ; les salariés consomment une partie de ces revenus, ce qui crée de nouveaux débouchés pour d'autres entreprises, et ainsi de suite.</p><div class=\"chain\" data-chain><div class=\"ct\">L'enchaînement d'une relance budgétaire</div><ol class=\"cs\"><li class=\"cst\">Hausse des dépenses publiques</li><li class=\"cst\">Hausse de la production des entreprises</li><li class=\"cst\">Hausse des revenus distribués (salaires, profits)</li><li class=\"cst\">Hausse de la consommation</li><li class=\"cst\">Nouvelle hausse de la production et de l'emploi</li></ol><div class=\"cbtn\"><button class=\"btn sm js-cnext\" type=\"button\">Étape suivante ▶</button><button class=\"btn sm ghost js-call\" type=\"button\">Tout afficher</button></div></div><div class=\"box def\"><div class=\"bt\">Définition · Effet multiplicateur <span class=\"copy\">✎ à recopier</span></div><p>Mécanisme par lequel une hausse initiale de la demande (par exemple une dépense publique) entraîne une hausse plus que proportionnelle de la production, grâce aux vagues successives de revenus et de consommation qu'elle provoque.</p></div><div class=\"widget\" data-w=\"multi\"></div><h4 class=\"h3\">4. Les stabilisateurs automatiques</h4><p>Une partie de la politique budgétaire fonctionne <b>sans décision nouvelle</b>. En récession, les recettes fiscales diminuent spontanément (moins de bénéfices donc moins d'impôt sur les sociétés, moins de consommation donc moins de TVA), tandis que les dépenses sociales augmentent (davantage d'allocations chômage). Le déficit se creuse automatiquement et soutient les revenus. En expansion, le mécanisme joue en sens inverse.</p><div class=\"box def\"><div class=\"bt\">Définition · Stabilisateurs automatiques <span class=\"copy\">✎ à recopier</span></div><p>Variations spontanées des recettes et des dépenses publiques en fonction de la conjoncture, qui amortissent les fluctuations sans intervention discrétionnaire de l'État. Ils s'opposent à la <b>politique budgétaire discrétionnaire</b>, qui résulte d'une décision explicite (plan de relance, hausse d'impôt).</p></div><p>Cela explique qu'on distingue, dans le solde public, une <b>part conjoncturelle</b> (due à la position dans le cycle, qui se résorbe avec la reprise) et une <b>part structurelle</b> (qui subsisterait même si l'économie tournait à son rythme normal). Les règles européennes s'intéressent surtout à la seconde.</p><h4 class=\"h3\">5. Les limites de la politique budgétaire</h4><ul><li><b>Le coût de la dette.</b> Une relance financée par emprunt augmente la dette publique et la charge des intérêts. Quand les taux d'intérêt montent, cette charge pèse sur les budgets suivants. En 2026, le taux d'emprunt de l'État français à dix ans atteint son plus haut niveau depuis 2002.</li><li><b>L'effet d'éviction.</b> Pour se financer, l'État emprunte sur les marchés financiers. Cette demande de capitaux peut faire monter les taux d'intérêt et rendre le crédit plus cher pour les entreprises, qui investissent alors moins.</li><li><b>La contrainte extérieure.</b> Dans une économie ouverte, une partie du revenu supplémentaire est dépensée en produits importés : la relance profite en partie aux producteurs étrangers et dégrade le solde extérieur.</li><li><b>Les délais.</b> Entre le diagnostic, le vote de la loi et la mise en œuvre des dépenses, plusieurs mois s'écoulent ; la mesure peut agir à contretemps.</li><li><b>Le cadre européen.</b> Les règles budgétaires communes limitent le déficit et la dette (voir partie IV).</li></ul>"}, {"key": "II.B", "title": "B. La politique monétaire", "html": "<h4 class=\"h3\">1. Définition et acteur</h4><div class=\"box def\"><div class=\"bt\">Définition · Politique monétaire <span class=\"copy\">✎ à recopier</span></div><p>Action de la <b>banque centrale</b> sur la quantité de monnaie en circulation et sur le coût du crédit (les taux d'intérêt), afin d'assurer la stabilité des prix et, indirectement, de soutenir l'activité économique.</p></div><p>Dans les pays de la zone euro, la politique monétaire n'est plus nationale. Elle est conduite par la <b>Banque centrale européenne (BCE)</b>, installée à Francfort, avec les banques centrales nationales (dont la Banque de France) : c'est l'<b>Eurosystème</b>. Depuis le 1<sup>er</sup> janvier 2026, la zone euro compte 21 pays, avec l'entrée de la Bulgarie.</p><ul><li><b>Son objectif principal</b>, fixé par les traités européens, est la <b>stabilité des prix</b>. Depuis 2021, la BCE la définit comme une inflation de <b>2 % à moyen terme</b>, objectif symétrique : une inflation trop basse est aussi indésirable qu'une inflation trop forte.</li><li><b>Elle est indépendante</b> : ni les gouvernements ni les institutions européennes ne peuvent lui donner d'instructions. Cette indépendance vise à protéger la valeur de la monnaie des pressions politiques de court terme.</li><li><b>Ses décisions</b> sont prises par le Conseil des gouverneurs, qui réunit les membres du directoire de la BCE et les gouverneurs des banques centrales nationales de la zone euro.</li></ul><h4 class=\"h3\">2. Les instruments de la BCE</h4><p>Les banques commerciales ont besoin de « monnaie banque centrale » pour fonctionner : elles l'empruntent à la BCE ou y déposent leurs excédents. En fixant le prix de cette monnaie, la BCE influence l'ensemble des taux d'intérêt de l'économie.</p><div class=\"tw\"><table><thead><tr><th>Instrument</th><th>Fonctionnement</th><th>Niveau depuis le 16 septembre 2026</th></tr></thead><tbody><tr><td>Taux de la facilité de dépôt</td><td>Taux auquel la BCE rémunère les liquidités que les banques déposent auprès d'elle jusqu'au lendemain. C'est aujourd'hui le taux directeur de référence.</td><td>2,50 %</td></tr><tr><td>Taux des opérations principales de refinancement</td><td>Taux auquel les banques empruntent des liquidités à la BCE pour une semaine, en apportant des titres en garantie.</td><td>2,65 %</td></tr><tr><td>Taux de la facilité de prêt marginal</td><td>Taux auquel les banques peuvent emprunter en urgence jusqu'au lendemain. Il constitue le plafond des taux du marché monétaire.</td><td>2,90 %</td></tr><tr><td>Achats de titres (assouplissement quantitatif)</td><td>La BCE achète des obligations publiques et privées pour faire baisser les taux d'intérêt de long terme. Utilisés massivement de 2015 à 2022, notamment pendant la pandémie.</td><td>Achats nets arrêtés ; portefeuille en réduction</td></tr><tr><td>Réserves obligatoires</td><td>Part des dépôts que chaque banque doit conserver sur son compte à la banque centrale.</td><td>1 % des dépôts concernés</td></tr></tbody></table></div><h4 class=\"h3\">3. Politique monétaire expansive ou restrictive</h4><div class=\"tw\"><table><thead><tr><th></th><th>Politique monétaire expansive (accommodante)</th><th>Politique monétaire restrictive</th></tr></thead><tbody><tr><td>Quand ?</td><td>Inflation inférieure à l'objectif, activité faible</td><td>Inflation supérieure à l'objectif</td></tr><tr><td>Comment ?</td><td>Baisse des taux directeurs, achats de titres</td><td>Hausse des taux directeurs, réduction du portefeuille de titres</td></tr><tr><td>Effet recherché</td><td>Rendre le crédit moins cher pour relancer la consommation et l'investissement</td><td>Rendre le crédit plus cher pour freiner la demande et donc la hausse des prix</td></tr><tr><td>Exemple</td><td>Juin 2024 – juin 2025 : la BCE ramène le taux de dépôt de 4 % à 2 % en huit baisses successives</td><td>Juillet 2022 – septembre 2023 : le taux de dépôt passe de 0 % à 4 % ; juin et septembre 2026 : deux hausses, à 2,50 %</td></tr></tbody></table></div><figure class=\"anim\"><svg viewBox=\"0 0 720 280\" role=\"img\" aria-label=\"Taux de la facilité de dépôt de la BCE de 2022 à 2026\" class=\"chart\"><line x1=\"52\" y1=\"245.0\" x2=\"705\" y2=\"245.0\" class=\"grid\"/><text x=\"46\" y=\"249.0\" text-anchor=\"end\" class=\"lab\">-1 %</text><line x1=\"52\" y1=\"205.9\" x2=\"705\" y2=\"205.9\" class=\"ax\"/><text x=\"46\" y=\"209.9\" text-anchor=\"end\" class=\"lab\">0 %</text><line x1=\"52\" y1=\"166.8\" x2=\"705\" y2=\"166.8\" class=\"grid\"/><text x=\"46\" y=\"170.8\" text-anchor=\"end\" class=\"lab\">1 %</text><line x1=\"52\" y1=\"127.7\" x2=\"705\" y2=\"127.7\" class=\"grid\"/><text x=\"46\" y=\"131.7\" text-anchor=\"end\" class=\"lab\">2 %</text><line x1=\"52\" y1=\"88.6\" x2=\"705\" y2=\"88.6\" class=\"grid\"/><text x=\"46\" y=\"92.6\" text-anchor=\"end\" class=\"lab\">3 %</text><line x1=\"52\" y1=\"49.5\" x2=\"705\" y2=\"49.5\" class=\"grid\"/><text x=\"46\" y=\"53.5\" text-anchor=\"end\" class=\"lab\">4 %</text><text x=\"55.0\" y=\"263\" class=\"lab\">2022</text><text x=\"192.5\" y=\"263\" class=\"lab\">2023</text><text x=\"329.9\" y=\"263\" class=\"lab\">2024</text><text x=\"467.4\" y=\"263\" class=\"lab\">2025</text><text x=\"604.9\" y=\"263\" class=\"lab\">2026</text><polyline points=\"52.0,225.5 120.7,225.5 120.7,205.9 143.6,205.9 143.6,176.6 166.6,176.6 166.6,147.3 178.0,147.3 178.0,127.7 200.9,127.7 200.9,108.2 212.4,108.2 212.4,88.6 235.3,88.6 235.3,78.9 246.8,78.9 246.8,69.1 269.7,69.1 269.7,59.3 281.1,59.3 281.1,49.5 384.2,49.5 384.2,59.3 418.6,59.3 418.6,69.1 430.1,69.1 430.1,78.9 453.0,78.9 453.0,88.6 475.9,88.6 475.9,98.4 487.3,98.4 487.3,108.2 498.8,108.2 498.8,118.0 521.7,118.0 521.7,127.7 659.2,127.7 659.2,118.0 693.5,118.0 693.5,108.2 705.0,108.2 705.0,108.2\" class=\"curve step\"/><circle cx=\"281.1\" cy=\"49.5\" r=\"4.5\" class=\"dot red\"/><text x=\"281.1\" y=\"39.5\" text-anchor=\"start\" class=\"lab b red\">4 % : sommet (sept. 2023)</text><circle cx=\"521.7\" cy=\"127.7\" r=\"4.5\" class=\"dot red\"/><text x=\"521.7\" y=\"147.7\" text-anchor=\"middle\" class=\"lab b red\">2 % (juin 2025)</text><circle cx=\"693.5\" cy=\"108.2\" r=\"4.5\" class=\"dot red\"/><text x=\"693.5\" y=\"98.2\" text-anchor=\"end\" class=\"lab b red\">2,50 % (sept. 2026)</text><text x=\"74.9\" y=\"43.7\" class=\"lab it\">Hausses rapides : inflation</text><text x=\"74.9\" y=\"59.3\" class=\"lab it\">10,6 % (oct. 2022)</text><text x=\"487.3\" y=\"43.7\" class=\"lab it\">Nouvelles hausses : inflation</text><text x=\"487.3\" y=\"59.3\" class=\"lab it\">3,8 % (sept. 2026)</text></svg><figcaption>Graphique 1 — Taux de la facilité de dépôt de la BCE, janvier 2022 – octobre 2026 (en %). Source : BCE.</figcaption><button class=\"btn sm ghost js-replay\" type=\"button\">↻ Rejouer l'animation</button></figure><h4 class=\"h3\">4. Les canaux de transmission</h4><p>La BCE ne fixe ni les prix ni la production. Ses décisions se transmettent à l'économie réelle par plusieurs <b>canaux</b>, avec un délai de l'ordre d'un à deux ans.</p><div class=\"chain\" data-chain><div class=\"ct\">Transmission d'une hausse des taux directeurs (politique restrictive)</div><ol class=\"cs\"><li class=\"cst\">La BCE relève ses taux directeurs</li><li class=\"cst\">Les banques empruntent plus cher et relèvent les taux des crédits</li><li class=\"cst\">Ménages et entreprises empruntent moins : consommation et investissement ralentissent</li><li class=\"cst\">La demande globale ralentit</li><li class=\"cst\">Les entreprises augmentent moins leurs prix : l'inflation recule</li></ol><div class=\"cbtn\"><button class=\"btn sm js-cnext\" type=\"button\">Étape suivante ▶</button><button class=\"btn sm ghost js-call\" type=\"button\">Tout afficher</button></div></div><div class=\"tw\"><table><thead><tr><th>Canal</th><th>Mécanisme</th></tr></thead><tbody><tr><td>Canal du crédit (taux d'intérêt)</td><td>Les taux des crédits immobiliers, à la consommation et aux entreprises suivent les taux directeurs : la demande de crédit, donc la dépense, varie en sens inverse des taux.</td></tr><tr><td>Canal de la richesse</td><td>Quand les taux baissent, la valeur des actions et des logements tend à monter : les ménages se sentent plus riches et consomment davantage (et inversement).</td></tr><tr><td>Canal du taux de change</td><td>Des taux plus élevés attirent les capitaux étrangers : l'euro s'apprécie, les importations deviennent moins chères, ce qui freine l'inflation importée, mais les exportations sont pénalisées.</td></tr><tr><td>Canal des anticipations</td><td>Si les agents croient que la BCE ramènera l'inflation à 2 %, ils modèrent leurs hausses de prix et leurs revendications salariales : la crédibilité de la banque centrale est en elle-même un instrument.</td></tr></tbody></table></div><div class=\"box donnee\"><div class=\"bt\">Donnée d'actualité — 2026</div><p>L'inflation de la zone euro est passée de 3,2 % en août 2026 à 3,8 % en septembre (estimation rapide). L'énergie progresse de 18,8 % sur un an, alors que l'inflation hors énergie, alimentation, alcool et tabac reste à 2,4 % en août. La BCE a relevé ses taux en juin puis en septembre 2026.</p><p><i>Point d'analyse :</i> une hausse des taux ne fait pas baisser le prix du pétrole. Elle vise à éviter que la hausse de l'énergie ne se diffuse aux autres prix et aux salaires (les « effets de second tour »), au prix d'un ralentissement de l'activité.</p></div><h4 class=\"h3\">5. Les limites de la politique monétaire</h4><ul><li><b>Une politique unique pour 21 économies différentes.</b> Le même taux s'applique à des pays dont la conjoncture diverge : il peut être trop élevé pour un pays en ralentissement et trop bas pour un pays en surchauffe.</li><li><b>Une efficacité inégale face aux chocs d'offre.</b> Face à une inflation venue de l'énergie, la hausse des taux freine la demande sans agir sur la cause du choc : elle combat l'inflation en pesant sur la croissance et l'emploi.</li><li><b>Des délais longs et incertains.</b> Les effets d'une décision se font sentir au bout de plusieurs trimestres.</li><li><b>Le coût pour les finances publiques.</b> La hausse des taux renchérit les nouveaux emprunts des États très endettés.</li></ul>"}, {"key": "II.C", "title": "C. La combinaison des deux politiques : le policy mix", "html": "<p>Les politiques budgétaire et monétaire agissent toutes deux sur la demande. Leur efficacité dépend de leur cohérence : on appelle <b>policy mix</b> la combinaison des deux.</p><div class=\"box def\"><div class=\"bt\">Définition · Policy mix <span class=\"copy\">✎ à recopier</span></div><p>Combinaison de la politique budgétaire et de la politique monétaire menées simultanément dans une économie. Elles peuvent aller dans le même sens (elles se renforcent) ou en sens contraire (elles se neutralisent en partie).</p></div><div class=\"tw\"><table><thead><tr><th></th><th>Politique monétaire expansive</th><th>Politique monétaire restrictive</th></tr></thead><tbody><tr><td>Politique budgétaire de relance</td><td>Relance maximale. Ex. : 2020-2021, plans de relance nationaux et achats massifs de titres par la BCE.</td><td>Effets opposés. Ex. : 2022-2023, boucliers tarifaires sur l'énergie pendant que la BCE relève ses taux.</td></tr><tr><td>Politique budgétaire de rigueur</td><td>Rigueur compensée. Ex. : 2015-2019, efforts budgétaires dans plusieurs pays et taux très bas de la BCE.</td><td>Freinage maximal. Ex. : situation de 2026-2027 en France, réduction du déficit et hausse des taux.</td></tr></tbody></table></div>"}], "ret": "<div class=\"box retenir\"><div class=\"bt\">À retenir — Partie II <span class=\"copy\">✎ à recopier</span></div><ul><li>La <b>politique budgétaire</b> agit par les dépenses et les recettes publiques ; elle est nationale. Relance : le déficit se creuse ; stabilisation : il se réduit.</li><li>L'<b>effet multiplicateur</b> amplifie l'effet d'une dépense publique ; les <b>stabilisateurs automatiques</b> amortissent le cycle sans décision nouvelle.</li><li>La <b>politique monétaire</b> agit par les taux directeurs et les achats de titres ; en zone euro, elle est conduite par la <b>BCE</b>, indépendante, avec un objectif d'inflation de 2 % à moyen terme.</li><li>Elle se transmet par les canaux du <b>crédit</b>, de la <b>richesse</b>, du <b>change</b> et des <b>anticipations</b>.</li><li>Le <b>policy mix</b> désigne la combinaison des deux politiques.</li></ul></div>"}, "III": {"title": "III. Classer les politiques économiques : deux grilles de lecture", "pre": "<p>Face à une mesure de l'actualité, deux questions suffisent pour la caractériser. <b>Sur quoi agit-elle</b> : la demande ou l'offre ? <b>À quel horizon</b> : le court terme (la conjoncture) ou le long terme (la structure de l'économie) ?</p>", "secs": [{"key": "III.A", "title": "A. Politique de demande ou politique d'offre", "html": "<div class=\"tw\"><table><thead><tr><th></th><th>Politique de demande</th><th>Politique d'offre</th></tr></thead><tbody><tr><td>Définition</td><td>Politique qui cherche à agir sur l'activité en stimulant (ou en freinant) la <b>demande globale</b> : consommation, investissement, dépenses publiques.</td><td>Politique qui cherche à améliorer les <b>conditions de production</b> des entreprises : coûts, rentabilité, compétitivité, capacité à innover.</td></tr><tr><td>Logique</td><td>Si les entreprises produisent moins, c'est qu'elles manquent de débouchés.</td><td>Si les entreprises produisent moins, c'est que produire leur coûte trop cher ou rapporte trop peu.</td></tr><tr><td>Instruments</td><td>Hausse des dépenses publiques, revalorisation des prestations sociales, baisse de l'impôt sur le revenu, baisse des taux d'intérêt</td><td>Baisse des impôts et des cotisations des entreprises, simplification administrative, soutien à l'innovation, formation, concurrence</td></tr><tr><td>Exemples</td><td>Chèques énergie, revalorisation du SMIC, plan de relance par l'investissement public</td><td>Baisse de l'impôt sur les sociétés de 33,3 % à 25 % (2018-2022) ; baisse des impôts de production de 10 Md€ par an (2021)</td></tr></tbody></table></div><div class=\"box piege\"><div class=\"bt\">Attention · Une même mesure peut se lire des deux côtés</div><p>Une baisse de cotisations sociales <b>patronales</b> réduit le coût du travail : c'est une mesure d'offre. Une baisse de cotisations <b>salariales</b> augmente le salaire net donc le pouvoir d'achat : c'est une mesure de demande. Toujours se demander <b>qui</b> bénéficie directement de la mesure : l'entreprise (offre) ou le ménage consommateur (demande).</p></div>"}, {"key": "III.B", "title": "B. Politique conjoncturelle ou politique structurelle", "html": "<div class=\"tw\"><table><thead><tr><th></th><th>Politique conjoncturelle</th><th>Politique structurelle</th></tr></thead><tbody><tr><td>Horizon</td><td>Court terme</td><td>Long terme</td></tr><tr><td>Objectif</td><td>Corriger les déséquilibres du moment : relancer en récession, freiner en surchauffe</td><td>Transformer durablement le fonctionnement de l'économie pour augmenter la croissance potentielle</td></tr><tr><td>Réversibilité</td><td>Mesures temporaires, ajustées selon le cycle</td><td>Réformes durables, effets lents mais persistants</td></tr><tr><td>Instruments</td><td>Politique budgétaire et politique monétaire</td><td>Éducation et formation, recherche, réforme du marché du travail, fiscalité, politique de la concurrence, infrastructures</td></tr><tr><td>Exemples</td><td>Chômage partiel massif en 2020 ; hausses des taux de la BCE en 2026</td><td>Plan d'investissement France 2030 (54 Md€ pour l'innovation et l'industrie) ; réforme de l'apprentissage de 2018</td></tr></tbody></table></div>"}, {"key": "III.C", "title": "C. La grille croisée : quatre cases pour tout classer", "html": "<p>Le programme précise que politiques d'offre et de demande peuvent s'inscrire « alternativement ou concomitamment » dans des cycles conjoncturels ou structurels. En croisant les deux grilles, on obtient quatre cases dans lesquelles toute mesure peut être rangée.</p><div class=\"tw\"><table><thead><tr><th></th><th>Politique de DEMANDE</th><th>Politique d'OFFRE</th></tr></thead><tbody><tr><td>CONJONCTURELLE<br/>(court terme)</td><td>Soutenir ou freiner la dépense dans l'immédiat.<br/><i>Ex. : plan de relance de 2020, prime exceptionnelle de rentrée, hausse des taux directeurs pour freiner le crédit.</i></td><td>Soulager temporairement les coûts des entreprises.<br/><i>Ex. : aide temporaire aux entreprises grandes consommatrices d'énergie, report de cotisations sociales en 2020.</i></td></tr><tr><td>STRUCTURELLE<br/>(long terme)</td><td>Modifier durablement le niveau ou la répartition de la demande.<br/><i>Ex. : création d'une nouvelle prestation sociale pérenne, investissement public durable dans les transports.</i></td><td>Améliorer durablement la capacité de production.<br/><i>Ex. : baisse pérenne de l'impôt sur les sociétés, France 2030, formation professionnelle, renforcement de la concurrence.</i></td></tr></tbody></table></div><div class=\"box methode\"><div class=\"bt\">Méthode — classer une mesure en deux questions</div><ol><li><b>Qui en bénéficie directement ?</b> Les ménages en tant que consommateurs → demande. Les entreprises en tant que producteurs → offre.</li><li><b>La mesure est-elle temporaire et liée à la conjoncture ?</b> Oui → conjoncturelle. Vise-t-elle à transformer durablement l'économie ? → structurelle.</li><li><b>Rédiger</b> en justifiant chaque critère : « Cette mesure est une politique d'offre, car elle réduit les coûts de production des entreprises ; elle est structurelle, car elle est pérenne et vise à améliorer durablement leur compétitivité. »</li></ol></div><div class=\"widget\" data-w=\"game\" data-g=\"0\"></div>"}, {"key": "III.D", "title": "D. La politique de la concurrence", "html": "<h4 class=\"h3\">1. Pourquoi protéger la concurrence ?</h4><p>Le chapitre 2 a montré que le marché ne conduit à une allocation efficace des ressources que si la concurrence fonctionne. Or les entreprises ont intérêt à la limiter : s'entendre sur les prix, se partager les clients, ou utiliser leur domination pour écarter les rivaux. La politique de la concurrence est une politique d'<b>offre</b> et une politique <b>structurelle</b> : elle vise à maintenir durablement des prix bas, une offre variée et une incitation à innover.</p><div class=\"box def\"><div class=\"bt\">Définition · Politique de la concurrence <span class=\"copy\">✎ à recopier</span></div><p>Ensemble des règles et des actions publiques destinées à garantir le libre jeu de la concurrence sur les marchés, en sanctionnant les pratiques anticoncurrentielles, en contrôlant les concentrations d'entreprises et en encadrant les aides publiques aux entreprises.</p></div><h4 class=\"h3\">2. Les quatre domaines d'intervention</h4><div class=\"tw\"><table><thead><tr><th>Domaine</th><th>Ce qui est interdit ou contrôlé</th><th>Exemple réel</th></tr></thead><tbody><tr><td>Ententes</td><td>Accords entre entreprises pour fixer les prix, se répartir les marchés ou limiter la production.</td><td>Décembre 2024 : l'Autorité de la concurrence sanctionne dix fabricants et deux distributeurs d'électroménager pour un montant total de 611 M€, pour entente sur les prix de revente.</td></tr><tr><td>Abus de position dominante</td><td>Une entreprise qui domine un marché utilise ce pouvoir pour évincer ses concurrents ou imposer ses conditions.</td><td>2017 : la Commission européenne inflige 2,42 Md€ d'amende à Google pour avoir favorisé son propre comparateur de prix ; décision confirmée par la Cour de justice de l'UE en 2024.</td></tr><tr><td>Contrôle des concentrations</td><td>Les fusions et rachats importants doivent être autorisés : ils peuvent être interdits s'ils créent une position trop dominante.</td><td>2019 : la Commission européenne interdit la fusion d'Alstom et de Siemens dans le ferroviaire, jugeant qu'elle aurait réduit la concurrence sur les trains à grande vitesse et la signalisation.</td></tr><tr><td>Aides d'État</td><td>Un État ne peut pas accorder à une entreprise un avantage (subvention, avantage fiscal) qui fausse la concurrence au sein du marché unique.</td><td>2024 : la Cour de justice de l'UE confirme que l'Irlande doit récupérer 13 Md€ d'avantages fiscaux accordés à Apple.</td></tr></tbody></table></div><h4 class=\"h3\">3. Qui la met en œuvre ?</h4><ul><li><b>En France, l'Autorité de la concurrence</b>, autorité administrative indépendante. Elle peut infliger des amendes allant jusqu'à <b>10 % du chiffre d'affaires mondial</b> d'une entreprise. La <b>procédure de clémence</b> permet à une entreprise qui dénonce une entente à laquelle elle a participé d'obtenir une réduction, voire une exonération totale d'amende : c'est ainsi qu'a été démantelée en 2017 une entente entre les trois principaux fabricants de sandwichs vendus en grande distribution.</li><li><b>Au niveau européen, la Commission européenne</b>, pour les pratiques qui affectent le commerce entre États membres, les grandes concentrations et les aides d'État. Ses décisions peuvent être contestées devant la Cour de justice de l'Union européenne.</li></ul>"}], "ret": "<div class=\"box retenir\"><div class=\"bt\">À retenir — Partie III <span class=\"copy\">✎ à recopier</span></div><ul><li>Une <b>politique de demande</b> stimule les débouchés ; une <b>politique d'offre</b> améliore les conditions de production.</li><li>Une <b>politique conjoncturelle</b> agit à court terme sur le cycle ; une <b>politique structurelle</b> transforme durablement l'économie.</li><li>Les deux grilles se croisent : toute mesure se range dans l'une des <b>quatre cases</b>.</li><li>La <b>politique de la concurrence</b> (ententes, abus de position dominante, concentrations, aides d'État) est une politique d'offre structurelle, menée par l'Autorité de la concurrence et la Commission européenne.</li></ul></div>"}, "IV": {"title": "IV. Le rôle de l'État dans le cadre européen", "pre": "<p>En adoptant l'euro en 1999, la France a fait un choix majeur : elle a transféré sa politique monétaire à une institution européenne et accepté d'encadrer sa politique budgétaire par des règles communes. Son rôle de régulateur n'a pas disparu, mais il s'exerce désormais dans un cadre partagé.</p>", "secs": [{"key": "IV.A", "title": "A. La politique monétaire européenne : un transfert de souveraineté", "html": "<p>Avant l'euro, la Banque de France fixait ses taux et l'État pouvait jouer sur la valeur du franc (dévaluation) pour rendre ses exportations plus compétitives. Depuis 1999, ces deux leviers ont disparu au niveau national :</p><ul><li><b>Les taux d'intérêt</b> sont fixés par la BCE pour l'ensemble de la zone euro, en fonction de l'inflation moyenne de la zone et non de la situation française.</li><li><b>Le taux de change</b> de l'euro résulte du marché ; un pays membre ne peut plus dévaluer sa monnaie.</li></ul><p><b>Les avantages attendus</b> : disparition des coûts de change et des risques de change entre pays membres, transparence des prix dans le marché unique, crédibilité d'une banque centrale indépendante qui a permis des taux d'intérêt longtemps bas. <b>La contrepartie</b> : face à un choc qui ne touche qu'un pays, celui-ci ne peut plus compter que sur sa politique budgétaire.</p><div class=\"box retenir\"><div class=\"bt\">À retenir · Conséquence essentielle <span class=\"copy\">✎ à recopier</span></div><p>Pour un pays de la zone euro, la <b>politique budgétaire</b> devient le principal instrument national de politique conjoncturelle. C'est précisément pour cette raison que l'Union européenne l'encadre.</p></div>"}, {"key": "IV.B", "title": "B. Des politiques budgétaires encadrées : les critères européens", "html": "<h4 class=\"h3\">1. Pourquoi des règles communes ?</h4><p>Dans une union monétaire, le déficit excessif d'un pays peut nuire à tous : si les marchés doutent de sa capacité à rembourser, la crise de confiance peut se propager aux autres membres et menacer la stabilité de l'euro. C'est ce qui s'est produit avec la crise des dettes souveraines de 2010-2012, partie de la Grèce. Les règles budgétaires visent donc à éviter qu'un pays ne fasse supporter aux autres le coût de ses déséquilibres.</p><h4 class=\"h3\">2. Les deux critères de référence</h4><p>Fixés par le traité de Maastricht (1992), puis repris par le Pacte de stabilité et de croissance (1997), deux seuils demeurent les références :</p><div class=\"tw\"><table><thead><tr><th>Critère</th><th>Seuil de référence</th><th>France 2025</th><th>France 2026 (prévision)</th><th>France 2027 (PLF)</th></tr></thead><tbody><tr><td>Déficit public</td><td>3 % du PIB</td><td>5,1 %</td><td>5,4 %</td><td>5,0 %</td></tr><tr><td>Dette publique</td><td>60 % du PIB</td><td>115,6 %</td><td>119,3 %</td><td>121,7 %</td></tr></tbody></table></div><div class=\"widget\" data-w=\"criteres\"></div><p><i>Sources : INSEE, comptes nationaux des administrations publiques (mars 2026) pour 2025 ; projet de loi de finances pour 2027, présenté le 1<sup>er</sup> octobre 2026, pour 2026 et 2027.</i></p><h4 class=\"h3\">3. Des règles réformées en 2024</h4><p>Les règles ont été suspendues de 2020 à 2023 (activation de la « clause dérogatoire générale » pendant la pandémie), puis réformées en 2024. Les seuils de 3 % et 60 % sont maintenus, mais la surveillance change de méthode :</p><ul><li>chaque État présente un <b>plan budgétaire et structurel national à moyen terme</b> (quatre ans, prolongeable jusqu'à sept ans s'il s'engage sur des réformes et des investissements) ;</li><li>le suivi porte sur un indicateur principal, l'<b>évolution des dépenses publiques nettes</b>, plus facile à piloter que le déficit, qui dépend aussi de la conjoncture ;</li><li>un pays dont le déficit dépasse 3 % peut être placé en <b>procédure de déficit excessif</b> : il doit suivre une trajectoire de correction, sous peine de sanctions financières.</li></ul><div class=\"box donnee\"><div class=\"bt\">Donnée d'actualité — la France sous procédure de déficit excessif</div><p>La France fait l'objet d'une procédure de déficit excessif depuis juillet 2024. Sa trajectoire prévoit un retour du déficit sous 3 % du PIB en 2029. Le projet de loi de finances pour 2027 annonce un effort de 54 Md€ pour ramener le déficit de 5,4 % à 5 % du PIB, avec une hypothèse de croissance de 1 %.</p><p><i>Point d'analyse :</i> réduire le déficit en période de ralentissement et de hausse des taux revient à mener une politique budgétaire de stabilisation au moment où la politique monétaire devient restrictive. Le risque est de freiner davantage la croissance, donc les recettes fiscales.</p></div>"}, {"key": "IV.C", "title": "C. Des marges de manœuvre réduites, mais pas nulles", "html": "<p>Le cadre européen n'est pas seulement une contrainte. Il offre aussi des moyens d'action collective que les États n'auraient pas seuls :</p><ul><li><b>La souplesse en cas de crise grave</b> : en 2020, la suspension des règles a permis aux États de laisser filer leurs déficits pour soutenir l'économie.</li><li><b>Une capacité d'emprunt commune</b> : le plan de relance européen <b>NextGenerationEU</b> (750 Md€, 2020) a été financé par un emprunt de l'Union elle-même ; la France en a reçu environ 40 Md€ de subventions, qui ont financé une partie de France Relance.</li><li><b>La politique de la concurrence</b> menée à l'échelle du marché unique, plus efficace face aux grandes entreprises mondiales qu'une autorité nationale seule.</li><li><b>Les leviers nationaux conservés</b> : le choix de la structure des dépenses et des impôts, les politiques structurelles (formation, recherche, marché du travail), la politique industrielle dans le respect des règles sur les aides d'État.</li></ul>"}], "ret": "<div class=\"box retenir\"><div class=\"bt\">À retenir — Partie IV <span class=\"copy\">✎ à recopier</span></div><ul><li>Depuis 1999, la <b>politique monétaire</b> des pays de la zone euro est conduite par la <b>BCE</b> : l'État a perdu la maîtrise des taux d'intérêt et du taux de change.</li><li>La <b>politique budgétaire</b> reste nationale mais <b>encadrée</b> : déficit public de 3 % du PIB, dette publique de 60 % du PIB, plans à moyen terme et procédure de déficit excessif.</li><li>La France, avec un déficit de 5,4 % du PIB prévu en 2026, est sous <b>procédure de déficit excessif</b>.</li><li>Le cadre européen offre aussi des leviers collectifs : souplesse en cas de crise, emprunt commun, politique de la concurrence.</li></ul></div>"}}, "intro": "<p>Au printemps 2020, l'activité française s'effondre en quelques semaines : le PIB recule d'environ 7,5 % sur l'année, du jamais-vu depuis la Seconde Guerre mondiale. L'État déploie le chômage partiel, des prêts garantis et un plan de relance de 100 milliards d'euros ; la Banque centrale européenne (BCE) achète massivement des titres de dette. Deux ans plus tard, le problème s'inverse : l'inflation de la zone euro atteint 10,6 % en octobre 2022 et la BCE relève ses taux à un rythme jamais observé depuis sa création.</p><p>En 2026, un nouveau choc énergétique fait remonter l'inflation de la zone euro à 3,8 % en septembre (estimation rapide d'Eurostat). La BCE relève ses taux directeurs en juin puis en septembre, tandis que le gouvernement français présente un projet de budget qui cherche à réduire un déficit public de 5,4 % du PIB. Deux autorités, deux instruments, deux échelles de décision : nationale pour le budget, européenne pour la monnaie.</p><div class=\"box info\"><div class=\"bt\">Problématique</div><p>De quels leviers l'État dispose-t-il encore pour stabiliser l'activité économique, et que change l'appartenance à la zone euro ?</p></div><p><b>Annonce du plan.</b> Nous verrons d'abord que les fluctuations de l'activité justifient l'intervention de l'État (I), puis quels sont les leviers de la politique conjoncturelle, budgétaire et monétaire (II). Nous classerons ensuite les politiques économiques selon deux grilles, offre / demande et conjoncturel / structurel, en y intégrant la politique de la concurrence (III). Nous montrerons enfin comment l'appartenance à la zone euro transforme et encadre le rôle de l'État (IV).</p>", "concl": "<p>L'État dispose de deux grands leviers pour stabiliser l'activité : le budget et la monnaie. Il peut agir sur la demande ou sur l'offre, à court terme ou à long terme, et protège la concurrence pour garantir l'efficacité des marchés. Mais pour un pays de la zone euro, ces leviers ne sont plus tous entre ses mains : la politique monétaire est européenne, et la politique budgétaire, seul grand instrument conjoncturel resté national, est encadrée par des règles communes. La situation de 2026 illustre cette tension : face à l'inflation, la BCE resserre sa politique pour toute la zone, tandis que la France, très endettée, doit réduire son déficit en pleine phase de ralentissement.</p><p><b>Ouverture.</b> Les politiques économiques visent aussi des objectifs de justice sociale : réduire les inégalités par la redistribution et la protection sociale. C'est l'objet du chapitre 4 (sous-thème 6.4).</p>", "arc": "<p><b>Question type :</b> « À l'aide du document, caractérisez l'orientation de la politique monétaire de la BCE en 2026. »</p><div class=\"tw\"><table><thead><tr><th>Étape</th><th>Réponse rédigée</th></tr></thead><tbody><tr><td><b>A</b> · Affirmer</td><td>En 2026, la BCE mène une politique monétaire restrictive.</td></tr><tr><td><b>R</b> · Référencer</td><td>Selon le document, elle a relevé son taux de dépôt de 2 % à 2,25 % en juin 2026, puis à 2,50 % en septembre, alors que l'inflation de la zone euro atteignait 3,8 % en septembre, au-dessus de son objectif de 2 %.</td></tr><tr><td><b>C</b> · Conclure</td><td>En rendant le crédit plus cher, la BCE cherche à freiner la demande de consommation et d'investissement, afin d'éviter que la hausse des prix de l'énergie ne se diffuse à l'ensemble des prix et des salaires. Il s'agit donc bien d'une politique restrictive, au service de la stabilité des prix.</td></tr></tbody></table></div>", "lex": [["Fluctuations économiques", "Variations de court terme de l'activité autour de sa tendance de long terme."], ["Cycle économique", "Succession de phases d'expansion et de contraction de l'activité, d'une durée et d'une amplitude variables."], ["Expansion", "Phase de croissance soutenue et durable du PIB."], ["Récession", "Recul du PIB pendant au moins deux trimestres consécutifs."], ["Dépression", "Recul important et durable de la production, souvent accompagné d'une baisse générale des prix."], ["Crise", "Retournement brutal de la conjoncture, point de passage de l'expansion à la contraction."], ["Politique contracyclique", "Politique qui agit en sens inverse de la conjoncture pour atténuer les fluctuations."], ["Politique budgétaire", "Action sur l'activité par les dépenses et les recettes publiques."], ["Politique monétaire", "Action de la banque centrale sur la quantité de monnaie et le coût du crédit, principalement pour assurer la stabilité des prix."], ["Politique de relance", "Politique visant à stimuler la demande en période de ralentissement (hausse des dépenses, baisse des impôts ou des taux)."], ["Politique de stabilisation", "Politique visant à freiner la demande ou à assainir les finances publiques (baisse des dépenses, hausse des impôts ou des taux)."], ["Politique de demande", "Politique qui agit sur l'activité par la demande globale (consommation, investissement, dépenses publiques)."], ["Politique d'offre", "Politique qui améliore les conditions de production des entreprises (coûts, rentabilité, innovation)."], ["Politique conjoncturelle", "Politique de court terme visant à corriger les déséquilibres du moment."], ["Politique structurelle", "Politique de long terme visant à transformer durablement le fonctionnement de l'économie."], ["Politiques de la concurrence", "Règles et actions publiques garantissant le libre jeu de la concurrence : ententes, abus de position dominante, concentrations, aides d'État."], ["Politique monétaire européenne", "Politique monétaire unique de la zone euro, conduite par la BCE, indépendante, avec un objectif d'inflation de 2 % à moyen terme."], ["Critères européens des déficits publics", "Seuils de référence de 3 % du PIB pour le déficit public et de 60 % du PIB pour la dette publique, assortis d'une surveillance des plans budgétaires nationaux."]], "checks": {"I.A": [{"q": "Dans le cycle économique, la crise désigne :", "o": ["la phase durant laquelle le PIB recule durablement", "la baisse générale et durable du niveau des prix", "la période de croissance qui suit le creux du cycle", "le moment où la conjoncture se retourne brutalement"], "a": 3, "e": "La crise est un moment de retournement, pas une phase. Le recul durable du PIB est la récession ; la baisse générale des prix est la déflation.", "vf": false}, {"q": "En 2009, la France a connu une récession.", "o": ["Vrai", "Faux"], "a": 0, "e": "Vrai : le PIB a reculé d'environ 3 % sur l'année, après la crise de 2008 (faillite de Lehman Brothers).", "vf": true}, {"q": "La hausse brutale du prix de l'énergie en 2022 est :", "o": ["une politique de rigueur de l'État", "un choc d'offre qui renchérit les coûts", "un choc de demande lié aux exportations", "un stabilisateur automatique du cycle"], "a": 1, "e": "L'énergie est un coût de production : sa hausse réduit la capacité des entreprises à produire au même prix. C'est un choc d'offre.", "vf": false}], "I.B": [{"q": "Pourquoi le carré de Kaldor est-il qualifié de « magique » ?", "o": ["Il a été conçu par la Banque centrale européenne", "Ses quatre objectifs progressent ensemble en général", "Ses quatre objectifs sont rarement atteints ensemble", "Il permet de prévoir les crises plusieurs années à l'avance"], "a": 2, "e": "Aucun pays n'atteint durablement les quatre objectifs à la fois : ils sont souvent contradictoires, toute politique est un arbitrage.", "vf": false}, {"q": "Une relance de la demande peut dégrader :", "o": ["le solde extérieur, car les importations augmentent", "l'emploi, car les entreprises réduisent leurs effectifs", "les prix, car la demande de biens diminue fortement", "la croissance, car la production des entreprises recule"], "a": 0, "e": "Une partie des revenus supplémentaires est dépensée en produits importés : le solde extérieur se dégrade. Croissance et emploi, eux, s'améliorent.", "vf": false}, {"q": "Réduire fortement les dépenses publiques en pleine récession est une politique contracyclique.", "o": ["Vrai", "Faux"], "a": 1, "e": "Faux : freiner la demande quand l'activité recule va dans le sens du cycle. C'est une politique procyclique (zone euro, 2011-2012).", "vf": true}], "II.A": [{"q": "Lequel de ces éléments est un instrument de la politique budgétaire ?", "o": ["L'achat d'obligations par la BCE", "La baisse du taux de dépôt de la BCE", "La baisse de l'impôt sur le revenu", "La hausse des réserves obligatoires"], "a": 2, "e": "La politique budgétaire agit par les dépenses et les recettes publiques (impôts). Les trois autres instruments appartiennent à la BCE.", "vf": false}, {"q": "En récession, sans aucune décision nouvelle, le déficit public :", "o": ["se creuse : recettes en baisse, allocations en hausse", "reste stable, car le budget est voté pour l'année", "disparaît, car la BCE rembourse une partie de la dette", "se réduit, car l'État dépense moins pour ses agents"], "a": 0, "e": "C'est le jeu des stabilisateurs automatiques : moins d'impôts rentrent, plus d'allocations sont versées. Le déficit se creuse et soutient les revenus.", "vf": false}, {"q": "L'effet d'éviction désigne la hausse des taux d'intérêt provoquée par les emprunts de l'État, qui peut freiner l'investissement privé.", "o": ["Vrai", "Faux"], "a": 0, "e": "Vrai : en empruntant beaucoup, l'État fait monter le prix du crédit, ce qui peut décourager l'investissement des entreprises.", "vf": true}], "II.B": [{"q": "Depuis 2021, la BCE définit la stabilité des prix comme :", "o": ["une inflation alignée sur les États-Unis", "une inflation de 2 % à moyen terme", "une inflation nulle chaque année", "une inflation inférieure à 4 % par an"], "a": 1, "e": "Objectif symétrique de 2 % à moyen terme : une inflation trop basse est aussi indésirable qu'une inflation trop forte.", "vf": false}, {"q": "Quel canal de transmission passe par la valeur des actions et des logements ?", "o": ["Le canal des anticipations", "Le canal du crédit", "Le canal du taux de change", "Le canal de la richesse"], "a": 3, "e": "Quand les taux baissent, actions et logements prennent de la valeur : les ménages se sentent plus riches et consomment davantage. C'est le canal de la richesse.", "vf": false}, {"q": "Une hausse des taux directeurs fait baisser directement le prix du pétrole.", "o": ["Vrai", "Faux"], "a": 1, "e": "Faux : elle freine la demande pour éviter que la hausse de l'énergie ne se diffuse aux autres prix et aux salaires (effets de second tour).", "vf": true}], "II.C": [{"q": "Boucliers tarifaires de l'État et hausse des taux de la BCE en 2022-2023 : quel policy mix ?", "o": ["Des effets opposés", "Un freinage maximal", "Une rigueur compensée", "Une relance maximale"], "a": 0, "e": "Le budget soutient la demande pendant que la monnaie la freine : les deux politiques vont en sens contraire.", "vf": false}, {"q": "En zone euro, la politique budgétaire et la politique monétaire sont décidées par la même autorité.", "o": ["Vrai", "Faux"], "a": 1, "e": "Faux : le budget relève de chaque État (Parlement national), la monnaie de la BCE, indépendante.", "vf": true}], "III.A": [{"q": "Une baisse des cotisations sociales salariales est une mesure de demande, car elle :", "o": ["réduit le coût du travail des entreprises", "accroît les recettes de la sécurité sociale", "augmente le salaire net des ménages", "améliore la compétitivité des exportations"], "a": 2, "e": "Le salaire net augmente, donc le pouvoir d'achat et la consommation : c'est une mesure de demande. Une baisse des cotisations patronales serait une mesure d'offre.", "vf": false}, {"q": "Quelle est la logique d'une politique d'offre ?", "o": ["La banque centrale maintient des taux trop bas", "Les entreprises manquent de clients et de débouchés", "Les ménages épargnent trop et consomment trop peu", "Produire coûte trop cher ou rapporte trop peu"], "a": 3, "e": "La politique d'offre agit sur les conditions de production (coûts, rentabilité, innovation). Le manque de débouchés est la logique de la politique de demande.", "vf": false}], "III.B": [{"q": "Le plan France 2030 est une politique :", "o": ["monétaire, car il est financé par la BCE", "structurelle, car il vise le long terme", "de rigueur, car il réduit les dépenses", "conjoncturelle, car il répond à une crise"], "a": 1, "e": "54 Md€ pour l'innovation et l'industrie : il vise à transformer durablement l'appareil productif. C'est une politique structurelle (et d'offre).", "vf": false}, {"q": "Une politique conjoncturelle repose sur des mesures temporaires, ajustées selon le cycle.", "o": ["Vrai", "Faux"], "a": 0, "e": "Vrai : elle corrige les déséquilibres du moment, à la différence de la politique structurelle, durable.", "vf": true}], "III.C": [{"q": "Le report de trois mois des cotisations sociales des entreprises en 2020 relève de la case :", "o": ["offre · conjoncturelle", "offre · structurelle", "demande · structurelle", "demande · conjoncturelle"], "a": 0, "e": "Il soulage les entreprises (offre), de façon temporaire pendant la crise sanitaire (conjoncturelle).", "vf": false}, {"q": "Pour classer une mesure, la première question à se poser est :", "o": ["Quel ministre l'a proposée ?", "Qui en bénéficie directement ?", "Combien coûte-t-elle à l'État ?", "Est-elle populaire dans l'opinion ?"], "a": 1, "e": "Ménages consommateurs → demande ; entreprises productrices → offre. Puis : temporaire (conjoncturelle) ou durable (structurelle) ?", "vf": false}], "III.D": [{"q": "La fusion Alstom-Siemens, interdite en 2019, relève :", "o": ["de l'abus de position dominante", "de la sanction des ententes", "du contrôle des concentrations", "du contrôle des aides d'État"], "a": 2, "e": "Les fusions importantes doivent être autorisées ; la Commission européenne a jugé que celle-ci réduisait trop la concurrence.", "vf": false}, {"q": "La procédure de clémence permet à une entreprise qui dénonce une entente :", "o": ["de racheter les entreprises qui ont participé à l'entente", "de fixer ses prix sans contrôle pendant plusieurs années", "de recevoir une aide de l'État pour indemniser ses clients", "d'obtenir une réduction, voire une exonération d'amende"], "a": 3, "e": "La dénonciation est récompensée : chaque membre craint d'être dénoncé et l'entente devient instable.", "vf": false}, {"q": "L'Autorité de la concurrence peut infliger une amende allant jusqu'à 10 % du chiffre d'affaires mondial d'une entreprise.", "o": ["Vrai", "Faux"], "a": 0, "e": "Vrai : c'est le plafond légal, qui rend les sanctions dissuasives même pour les grandes entreprises.", "vf": true}], "I
