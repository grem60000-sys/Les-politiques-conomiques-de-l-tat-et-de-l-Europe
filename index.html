V.A": [{"q": "Depuis 1999, un pays de la zone euro ne peut plus :", "o": ["dévaluer sa monnaie pour gagner en compétitivité", "investir dans ses infrastructures de transport", "voter chaque année sa propre loi de finances", "modifier le taux de son impôt sur le revenu"], "a": 0, "e": "La monnaie est commune : plus de dévaluation ni de taux d'intérêt nationaux. Le budget, lui, reste voté par chaque Parlement.", "vf": false}, {"q": "Face à un choc qui ne touche que lui, un pays de la zone euro peut obtenir une baisse des taux de la BCE décidée pour lui seul.", "o": ["Vrai", "Faux"], "a": 1, "e": "Faux : la BCE fixe un taux unique selon l'inflation moyenne de la zone. Le pays ne peut compter que sur sa politique budgétaire.", "vf": true}], "IV.B": [{"q": "Les règles budgétaires communes visent d'abord à :", "o": ["obliger chaque État à équilibrer son budget chaque année", "éviter qu'un pays fasse peser ses déséquilibres sur les autres", "fixer le même taux d'imposition dans tous les pays membres", "transférer le vote des budgets nationaux à la Commission"], "a": 1, "e": "Dans une union monétaire, une crise de confiance dans un pays peut se propager à tous (crise grecque, 2010-2012).", "vf": false}, {"q": "Depuis la réforme de 2024, l'indicateur principal de suivi des budgets nationaux est :", "o": ["le taux de chômage au sens du BIT", "le solde des échanges extérieurs du pays", "le taux d'inflation de chaque État membre", "l'évolution des dépenses publiques nettes"], "a": 3, "e": "Les seuils de 3 % et 60 % restent les références, mais le suivi porte sur la trajectoire des dépenses nettes, plus facile à piloter que le déficit.", "vf": false}], "IV.C": [{"q": "Le plan NextGenerationEU (2020) a été financé par :", "o": ["une hausse de la TVA dans les pays membres", "une création monétaire directe de la BCE", "un emprunt commun de l'Union européenne", "les amendes de la politique de la concurrence"], "a": 2, "e": "750 Md€ empruntés par l'Union elle-même ; la France a reçu environ 40 Md€ de subventions.", "vf": false}, {"q": "Un État de la zone euro conserve la maîtrise de ses politiques structurelles (formation, recherche, marché du travail).", "o": ["Vrai", "Faux"], "a": 0, "e": "Vrai : ce sont des leviers nationaux conservés, dans le respect des règles sur les aides d'État.", "vf": true}]}, "final": [{"q": "Une récession correspond à :", "o": ["une croissance du PIB inférieure à 1 % sur une année entière", "un recul du PIB pendant au moins deux trimestres consécutifs", "une hausse du taux de chômage pendant deux trimestres de suite", "une baisse générale des prix pendant plusieurs mois consécutifs"], "a": 1, "e": "La récession se définit par un recul du PIB (et non un simple ralentissement) pendant au moins deux trimestres consécutifs. La baisse générale des prix caractérise plutôt la déflation, souvent associée à une dépression.", "sec": "I.A"}, {"q": "Un pays dont le PIB progresse de 0,5 % sur l'année connaît :", "o": ["une récession, car sa croissance est inférieure à 1 %", "une dépression, car son activité progresse très peu", "un ralentissement, car son PIB continue d'augmenter", "une crise, car sa croissance est inférieure à la tendance"], "a": 2, "e": "Tant que le PIB augmente, même faiblement, il n'y a pas de récession : on parle de ralentissement. C'est la situation prévue pour la France en 2026.", "sec": "I.A"}, {"q": "Les quatre sommets du carré magique de Kaldor sont :", "o": ["croissance, plein emploi, stabilité des prix, équilibre extérieur", "croissance, stabilité des prix, faible dette, équilibre extérieur", "plein emploi, équilibre budgétaire, faible dette, croissance du PIB", "croissance, plein emploi, équilibre budgétaire, stabilité des prix"], "a": 0, "e": "Le carré magique retient la croissance, le plein emploi, la stabilité des prix et l'équilibre extérieur. L'équilibre budgétaire et la dette n'en font pas partie : ce sont des contraintes, pas des objectifs finaux.", "sec": "I.B"}, {"q": "En période de surchauffe, une politique contracyclique consiste à :", "o": ["réduire les impôts pour accroître le pouvoir d'achat", "augmenter les dépenses publiques pour prolonger la croissance", "baisser les taux d'intérêt pour soutenir l'investissement", "freiner la demande globale afin de limiter la hausse des prix"], "a": 3, "e": "Agir à contre-courant du cycle : quand l'activité s'emballe et que les prix accélèrent, on freine la demande. Les trois autres mesures relancent la demande : elles seraient procycliques.", "sec": "I.B"}, {"q": "Les stabilisateurs automatiques désignent :", "o": ["les plans de relance votés par le Parlement lorsque l'activité recule fortement", "les hausses de taux directeurs décidées par la BCE pour contenir l'inflation", "les règles européennes qui plafonnent le déficit public des États membres à 3 % du PIB", "les variations spontanées des recettes et des dépenses publiques selon la conjoncture"], "a": 3, "e": "En récession, les recettes fiscales baissent et les allocations chômage augmentent sans décision nouvelle : le déficit se creuse et soutient les revenus. Un plan de relance est au contraire une politique discrétionnaire.", "sec": "II.A"}, {"q": "L'effet multiplicateur signifie qu'une hausse des dépenses publiques :", "o": ["provoque une hausse des prix proportionnelle à la dépense engagée", "entraîne une hausse de la production supérieure à son montant initial", "multiplie le montant de la dette publique par le taux d'intérêt", "entraîne une hausse équivalente des recettes fiscales de l'État"], "a": 1, "e": "La dépense initiale crée des revenus, qui sont en partie consommés, ce qui crée de nouveaux débouchés et de nouveaux revenus : l'effet final sur la production dépasse la dépense de départ.", "sec": "II.A"}, {"q": "L'objectif principal assigné à la BCE par les traités est :", "o": ["la stabilité des prix, soit une inflation de 2 % à moyen terme", "la stabilité du taux de change de l'euro face aux autres monnaies", "l'équilibre des budgets publics de chacun des États de la zone euro", "le plein emploi, mesuré par un taux de chômage inférieur à 5 %"], "a": 0, "e": "Le mandat de la BCE est la stabilité des prix, définie depuis 2021 comme une inflation de 2 % à moyen terme. Elle ne fixe ni le budget des États ni un objectif de chômage.", "sec": "II.B"}, {"q": "Pour freiner l'inflation, la BCE :", "o": ["augmente ses achats de titres pour réduire la masse monétaire", "fixe un plafond aux hausses de prix pratiquées par les entreprises", "relève ses taux directeurs afin de rendre le crédit plus cher", "abaisse ses taux directeurs afin de stimuler l'épargne des ménages"], "a": 2, "e": "Une hausse des taux renchérit le crédit : ménages et entreprises empruntent et dépensent moins, la demande ralentit, les hausses de prix aussi. Les achats de titres produisent l'effet inverse, et la BCE ne fixe aucun prix.", "sec": "II.B"}, {"q": "Une hausse des taux directeurs se transmet d'abord :", "o": ["aux salaires fixés par les conventions collectives", "aux impôts payés par les ménages et les entreprises", "aux taux des crédits accordés par les banques commerciales", "aux prix de l'énergie importée par la zone euro"], "a": 2, "e": "La première étape de la transmission est bancaire : les banques, qui se refinancent plus cher, relèvent les taux de leurs crédits. Les effets sur la demande puis sur les prix viennent ensuite.", "sec": "II.B"}, {"q": "Une baisse pérenne de l'impôt sur les sociétés est une politique :", "o": ["d'offre et structurelle", "de demande et conjoncturelle", "d'offre et conjoncturelle", "de demande et structurelle"], "a": 0, "e": "Elle améliore la rentabilité des entreprises (offre) et elle est durable, destinée à renforcer la compétitivité à long terme (structurelle).", "sec": "III.C"}, {"q": "Le policy mix désigne :", "o": ["l'ensemble des réformes structurelles menées par un pays", "la combinaison des politiques budgétaire et monétaire", "la répartition des dépenses publiques entre les ministères", "la coordination des politiques de concurrence en Europe"], "a": 1, "e": "Le policy mix est la combinaison de la politique budgétaire et de la politique monétaire : elles peuvent se renforcer ou se contrarier.", "sec": "II.C"}, {"q": "Pour un pays de la zone euro, le principal levier conjoncturel resté national est :", "o": ["la politique monétaire", "la politique de taux d'intérêt", "la politique de change", "la politique budgétaire"], "a": 3, "e": "Taux d'intérêt et taux de change relèvent désormais de la BCE et du marché. Le budget reste national, mais il est encadré par les règles européennes.", "sec": "IV.A"}, {"q": "Le critère européen de référence pour la dette publique est fixé à :", "o": ["90 % du PIB", "100 % du PIB", "60 % du PIB", "3 % du PIB"], "a": 2, "e": "Les deux seuils de référence sont 3 % du PIB pour le déficit public (flux) et 60 % du PIB pour la dette publique (stock).", "sec": "IV.B"}, {"q": "En France, une entente sur les prix entre entreprises concurrentes est sanctionnée par :", "o": ["l'Autorité de la concurrence", "le Conseil constitutionnel", "la Banque centrale européenne", "la Cour des comptes"], "a": 0, "e": "L'Autorité de la concurrence, autorité administrative indépendante, sanctionne les ententes et les abus de position dominante, jusqu'à 10 % du chiffre d'affaires mondial.", "sec": "III.D"}], "exos": {"I": {"titre": "Lire la conjoncture française", "doc_titre": "Document — Taux de croissance du PIB en volume, France (en %)", "table": [["2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026*"], ["2,3", "1,9", "2,0", "−7,5", "6,4", "2,6", "1,1", "1,1", "0,9", "0,5"]], "source": "Source : INSEE, comptes nationaux ; * prévision du projet de loi de finances pour 2027. Valeurs arrondies.", "questions": [["Repérez dans le document l'année où la France a connu une récession. Justifiez.", "En 2020, le taux de croissance est négatif (−7,5 %) : le PIB a reculé. Il s'agit d'une récession (recul du PIB sur au moins deux trimestres consécutifs), provoquée par le confinement."], ["Calculez l'écart, en points de pourcentage, entre la croissance de 2022 et celle prévue en 2026.", "2,6 − 0,5 = 2,1 points de pourcentage. On parle de « points » car on compare deux taux exprimés en %."], ["Qualifiez la situation prévue en 2026. Justifiez avec le document.", "C'est un ralentissement : la croissance prévue est faible (0,5 %) et en baisse depuis 2022 (2,6 %), mais elle reste positive, donc le PIB continue d'augmenter. Ce n'est pas une récession."], ["Selon une logique contracyclique, quelle orientation de politique économique fallait-il adopter en 2020 ? Illustrez.", "Une politique de relance, pour soutenir la demande en pleine récession : hausse des dépenses publiques (chômage partiel, prêts garantis, plan France Relance de 100 Md€ en 2020) et taux d'intérêt bas, avec les achats de titres de la BCE."]]}, "II": {"titre": "Analyser la décision de la BCE", "doc_titre": "Document — La zone euro et la France à l'automne 2026", "lines": ["Inflation de la zone euro : 3,2 % en août 2026, 3,8 % en septembre (estimation rapide d'Eurostat).", "Prix de l'énergie : +18,8 % sur un an. Inflation hors énergie, alimentation, alcool et tabac : 2,4 % (août).", "Taux de la facilité de dépôt de la BCE : 2,00 % jusqu'en juin 2026, 2,25 % au 17 juin, 2,50 % au 16 septembre.", "Projet de loi de finances pour 2027 : effort annoncé de 54 Md€ pour ramener le déficit public de 5,4 % à 5 % du PIB."], "source": "Sources : Eurostat, BCE, projet de loi de finances pour 2027 (1er octobre 2026).", "questions": [["Caractérisez l'orientation de la politique monétaire de la BCE en 2026 (méthode ARC).", "A : la BCE mène une politique monétaire restrictive. R : elle a relevé son taux de dépôt de 2 % à 2,25 % en juin puis à 2,50 % en septembre 2026, alors que l'inflation atteint 3,8 %, au-dessus de son objectif de 2 %. C : en rendant le crédit plus cher, elle cherche à freiner la demande pour ramener l'inflation vers 2 %."], ["Expliquez par quel enchaînement cette décision doit faire reculer l'inflation.", "Hausse des taux directeurs → les banques se refinancent plus cher et relèvent les taux de leurs crédits → ménages et entreprises empruntent moins, la consommation et l'investissement ralentissent → la demande globale ralentit → les entreprises augmentent moins leurs prix : l'inflation recule, avec un délai d'un à deux ans."], ["Montrez que l'inflation de 2026 vient surtout d'un choc d'offre, puis indiquez la limite que cela pose à la politique monétaire.", "L'énergie augmente de 18,8 % alors que l'inflation hors énergie et alimentation n'est que de 2,4 % : la hausse des prix vient surtout du coût de l'énergie, donc d'un choc d'offre. Limite : la hausse des taux ne fait pas baisser le prix de l'énergie ; elle freine la demande pour éviter les effets de second tour, au prix d'un ralentissement de la croissance et de l'emploi."], ["Qualifiez le policy mix de la France pour 2026-2027 et indiquez un risque.", "Budget de stabilisation (effort de 54 Md€ pour réduire le déficit) et politique monétaire restrictive (hausses de taux) : c'est un freinage maximal. Risque : freiner fortement la demande en période de ralentissement, donc la croissance et les recettes fiscales."]]}, "III": {"titre": "Classer des mesures réelles", "doc_titre": "Document — Quatre mesures de politique économique", "lines": ["a. Baisse des impôts de production des entreprises de 10 Md€ par an, à partir de 2021.", "b. Chèque énergie exceptionnel versé aux ménages modestes en 2022.", "c. Réforme de l'apprentissage de 2018, pour former davantage de jeunes aux métiers recherchés.", "d. Amende de 611 M€ infligée en décembre 2024 à des fabricants et distributeurs d'électroménager pour entente sur les prix."], "source": "Sources : lois de finances, Autorité de la concurrence.", "questions": [["Classez chaque mesure dans la grille croisée en justifiant les deux critères.", "a. Offre (elle réduit les coûts de production des entreprises) et structurelle (pérenne, pour améliorer durablement la compétitivité). b. Demande (elle soutient le pouvoir d'achat des ménages) et conjoncturelle (ponctuelle, face à la flambée de l'énergie). c. Offre (elle améliore les compétences, donc les conditions de production) et structurelle (effets durables). d. Offre et structurelle : la politique de la concurrence garantit durablement des prix bas et l'incitation à innover."], ["Expliquez pourquoi la procédure de clémence rend les ententes instables.", "L'entreprise qui dénonce une entente à laquelle elle a participé obtient une réduction, voire une exonération d'amende. Chaque membre craint d'être dénoncé par un autre et a intérêt à dénoncer le premier : la confiance disparaît et l'entente se découvre plus facilement (entente des fabricants de sandwichs, 2017)."], ["Rédigez un paragraphe argumenté : « La politique de la concurrence est une politique d'offre structurelle. »", "Affirmer : la politique de la concurrence agit sur les conditions de production, de façon durable. Expliquer : en sanctionnant les ententes et les abus de position dominante, et en contrôlant les concentrations et les aides d'État, elle oblige les entreprises à baisser leurs prix, améliorer leurs produits et innover. Illustrer : amende de 611 M€ dans l'électroménager (2024), fusion Alstom-Siemens interdite (2019). Conclure : elle ne répond pas à la conjoncture du moment, elle améliore durablement le fonctionnement des marchés."]]}, "IV": {"titre": "La France face aux règles européennes", "doc_titre": "Document — Finances publiques de la France et critères européens (en % du PIB)", "table": [["", "Seuil de référence", "2025", "2026 (prévision)", "2027 (PLF)"], ["Déficit public", "3 %", "5,1 %", "5,4 %", "5,0 %"], ["Dette publique", "60 %", "115,6 %", "119,3 %", "121,7 %"]], "source": "Sources : INSEE (mars 2026) ; projet de loi de finances pour 2027. La France est sous procédure de déficit excessif depuis juillet 2024 ; retour sous 3 % prévu en 2029.", "questions": [["Calculez l'écart entre la dette publique prévue en 2027 et le critère européen. Que constatez-vous ?", "121,7 − 60 = 61,7 points de PIB : la dette prévue représente plus du double du seuil de référence."], ["Expliquez pourquoi la politique budgétaire est le principal levier conjoncturel d'un pays de la zone euro.", "Depuis 1999, les taux d'intérêt sont fixés par la BCE pour toute la zone et le pays ne peut plus dévaluer : face à un choc qui le touche seul, il ne peut agir que par son budget (dépenses et impôts)."], ["Pourquoi l'Union européenne encadre-t-elle les budgets nationaux ?", "Dans une union monétaire, le déficit excessif d'un pays peut provoquer une crise de confiance qui se propage aux autres membres et menace l'euro, comme lors de la crise des dettes souveraines partie de la Grèce (2010-2012)."], ["Argumentation courte : « Les règles européennes empêchent-elles toute action budgétaire de l'État ? » (plan détaillé)", "I. Des règles contraignantes : seuils de 3 % et 60 %, procédure de déficit excessif ; la France doit réduire son déficit de 5,4 % à 5 % en 2027 malgré le ralentissement. II. Mais des marges subsistent : suspension des règles en 2020 (clause dérogatoire), emprunt commun NextGenerationEU (environ 40 Md€ de subventions pour la France), choix national de la structure des dépenses et des impôts, politiques structurelles. Conclusion : l'action budgétaire est encadrée, pas supprimée."]]}}, "games": [{"id": "g1", "titre": "Jeu 1 · La grille croisée : dans quelle case ?", "consigne": "Classe chaque mesure dans l'une des quatre cases. Le bouton « Vérifier » indique seulement le nombre d'erreurs.", "cats": ["Demande · conjoncturelle", "Offre · conjoncturelle", "Demande · structurelle", "Offre · structurelle"], "items": [["Plan de relance de 2020 finançant des travaux de rénovation énergétique", 0], ["Prime exceptionnelle versée une fois aux ménages modestes à la rentrée", 0], ["Hausse des taux directeurs de la BCE pour freiner le crédit en 2026", 0], ["Report de trois mois des cotisations sociales des entreprises en 2020", 1], ["Aide temporaire aux entreprises grandes consommatrices d'énergie", 1], ["Création d'une nouvelle prestation sociale versée de façon pérenne", 2], ["Revalorisation durable des minima sociaux au-delà de l'inflation", 2], ["Baisse pérenne de l'impôt sur les sociétés de 33,3 % à 25 %", 3], ["Plan d'investissement France 2030 dans l'innovation et l'industrie", 3], ["Renforcement durable de la formation professionnelle des salariés", 3]]}, {"id": "g2", "titre": "Jeu 2 · Quelle politique, dans quel sens ?", "consigne": "Identifie l'instrument (budgétaire ou monétaire) et l'orientation de chaque mesure.", "cats": ["Budgétaire · relance", "Budgétaire · stabilisation", "Monétaire · expansive", "Monétaire · restrictive"], "items": [["Hausse des dépenses d'investissement public", 0], ["Baisse de l'impôt sur le revenu des ménages", 0], ["Gel des dépenses de fonctionnement de l'État", 1], ["Hausse du taux normal de TVA", 1], ["Baisse du taux de la facilité de dépôt", 2], ["Achats massifs d'obligations par la BCE", 2], ["Hausse du taux des opérations principales de refinancement", 3], ["Arrêt des achats de titres et réduction du portefeuille de la BCE", 3]]}], "calcs": [{"id": "c1", "enonce": "L'inflation de la zone euro est passée de 3,2 % en août 2026 à 3,8 % en septembre 2026. De combien de <b>points de pourcentage</b> a-t-elle augmenté ?", "unite": "point(s)", "rep": 0.6, "tol": 0.01, "corr": "3,8 − 3,2 = <b>0,6 point de pourcentage</b>. On parle de « points » quand on compare deux taux exprimés en %."}, {"id": "c2", "enonce": "Le taux de dépôt de la BCE est passé de 2,00 % à 2,50 % entre juin 2025 et septembre 2026. Calcule son <b>taux de variation</b> (en %).", "unite": "%", "rep": 25, "tol": 0.1, "corr": "(2,50 − 2,00) / 2,00 × 100 = <b>+ 25 %</b>. Le taux a augmenté de 0,5 point, soit une hausse de 25 % : ne pas confondre les deux formulations."}, {"id": "c3", "enonce": "Le déficit public français est prévu à 5,4 % du PIB en 2026. De combien de points dépasse-t-il le critère européen ?", "unite": "point(s)", "rep": 2.4, "tol": 0.01, "corr": "5,4 − 3 = <b>2,4 points de PIB</b> au-dessus du seuil de référence de 3 %."}, {"id": "c4", "enonce": "Hypothèse simplifiée : le PIB d'un pays s'élève à 3 000 Md€ et son déficit public à 5 % du PIB. Calcule le montant du déficit (en Md€).", "unite": "Md€", "rep": 150, "tol": 0.5, "corr": "3 000 × 5 / 100 = <b>150 Md€</b>. Ce montant s'ajoute à la dette publique de l'année."}, {"id": "c5", "enonce": "Une dépense publique de 10 Md€ entraîne, grâce à l'effet multiplicateur, une hausse de la production de 14 Md€. Calcule la valeur du multiplicateur (production supplémentaire / dépense initiale).", "unite": "", "rep": 1.4, "tol": 0.01, "corr": "14 / 10 = <b>1,4</b> : chaque euro de dépense publique a généré 1,40 € de production supplémentaire."}], "argu": {"sujet": "La politique budgétaire est-elle encore un levier efficace pour un État de la zone euro ?", "intro": "<b>Définitions :</b> la politique budgétaire est l'action des pouvoirs publics sur l'activité par les dépenses et les recettes publiques. La zone euro réunit 21 pays partageant la même monnaie et la même politique monétaire, conduite par la BCE. <b>Problème :</b> privé de la politique monétaire, l'État dispose-t-il encore, avec son budget, d'un instrument capable de stabiliser l'activité ? <b>Annonce :</b> la politique budgétaire reste un levier essentiel (I), mais son efficacité est fortement limitée (II).", "parties": [["I. Un levier qui reste essentiel", ["<b>Le seul grand instrument conjoncturel resté national.</b> La politique monétaire étant commune, seul le budget permet de répondre à un choc propre au pays. <i>Ex. : le plan France Relance de 100 Md€ en 2020.</i>", "<b>Un effet amplifié par le multiplicateur et les stabilisateurs automatiques.</b> En récession, la dépense publique soutient la demande et les revenus. <i>Ex. : en 2020, chômage partiel et prêts garantis ont limité les faillites et les pertes d'emplois.</i>"]], ["II. Un levier dont l'efficacité est limitée", ["<b>Un cadre européen contraignant.</b> Déficit de 3 % et dette de 60 % du PIB, procédure de déficit excessif. <i>Ex. : la France, sous procédure depuis 2024, doit ramener son déficit de 5,4 % (2026) à 5 % en 2027.</i>", "<b>Des marges réduites par la dette et la hausse des taux.</b> La charge d'intérêts augmente, la relance profite en partie aux importations. <i>Ex. : en 2026, le taux d'emprunt de l'État à dix ans atteint son plus haut niveau depuis 2002.</i>"]]], "concl": "La politique budgétaire reste le principal levier conjoncturel national d'un État de la zone euro, mais son efficacité dépend de l'état des finances publiques et du cadre européen. <b>Ouverture :</b> une capacité budgétaire commune, comme NextGenerationEU en 2020, pourrait-elle compléter les budgets nationaux ?"}, "sec2cap": {"I.A": "C1", "I.B": "C2", "II.A": "C3", "II.B": "C4", "II.C": "C5", "III.A": "C6", "III.B": "C6", "III.C": "C6", "III.D": "C7", "IV.A": "C8", "IV.B": "C8", "IV.C": "C8"}, "sectitles": {"I.A": "L'activité économique connaît des cycles", "I.B": "L'État cherche à stabiliser l'activité", "II.A": "La politique budgétaire", "II.B": "La politique monétaire", "II.C": "Le policy mix", "III.A": "Politique de demande ou politique d'offre", "III.B": "Politique conjoncturelle ou structurelle", "III.C": "La grille croisée", "III.D": "La politique de la concurrence", "IV.A": "La politique monétaire européenne", "IV.B": "Des politiques budgétaires encadrées", "IV.C": "Des marges réduites, mais pas nulles"}};

      const secs = cur === k && D.parts[k] ? `<div class="navsecs">${D.parts[k].secs.map((s, i) => `<a href="#sec-${s.key}" class="${S.checks[s.key] ? "ok" : secUnlocked(k, i) ? "" : "lock"}">${s.key} · ${D.sectitles[s.key]}</a>`).join("")}</div>` : "";
      return `<button class="navstep ${cur === k ? "cur" : ""} ${done ? "done" : ""}" data-go="step:${k}" ${open ? "" : "disabled"}><span class="k">${done ? "✓" : k === "F" ? "★" : k}</span><span class="t">${k === "0" ? "Étape 0" : k === "F" ? "Étape finale" : "Étape " + k}<small>${e.t}</small></span></button>${secs}`; }).join("") +
    `<h3 style="margin-top:18px">Options</h3><label class="row" style="font-size:.85rem;color:var(--grey);gap:8px"><input type="checkbox" id="freeMode" ${S.free ? "checked" : ""} style="width:20px;height:20px"> Mode révision : tout débloquer</label>
     <button class="btn sm ghost" id="resetAll" style="margin-top:10px">Recommencer à zéro</button>`;
  $$("#side [data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  $$("#side .navsecs a").forEach(a => a.onclick = () => closeDrawer());
  $("#freeMode").onchange = e => { S.free = e.target.checked; save(); render(); };
  $("#resetAll").onclick = () => { if (confirm("Effacer toute ta progression sur cet appareil ?")) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } };
}
function go(r, anchor) { S.route = r; save(); render(); closeDrawer(); if (anchor) setTimeout(() => { const el = document.getElementById(anchor); if (el) el.scrollIntoView({ behavior: "smooth" }); }, 80); else window.scrollTo(0, 0); }
function closeDrawer() { $("#side").classList.remove("open"); $("#dbg").classList.remove("open"); }

function render() {
  nav(); paintProg();
  const m = $("#main");
  if (S.route === "home") m.innerHTML = homeHTML();
  else { const k = S.route.slice(5); if (!stepOpen(k)) { S.route = "home"; return render(); } m.innerHTML = k === "0" ? step0HTML() : k === "F" ? stepFHTML() : partHTML(k); }
  wire(m);
}

/* ---------------------------------------------------------------- accueil */
function homeHTML() {
  const nextK = ORDER.find(k => !stepDone(k)) || "F";
  const started = units()[0] > 0;
  const cols = ["var(--navy2)", "var(--navy)", "var(--violet)", "var(--teal)", "var(--gold)"];
  return `<section class="hero"><div class="kick">${D.meta.matiere} · ${D.meta.chapitre}</div><h1>${D.meta.titre}</h1>
    <p>Cours en autonomie : un parcours guidé en 6 étapes. Avance à ton rythme ; ta progression est enregistrée sur cet appareil.</p>
    <div class="pb"><span>Problématique</span>${D.meta.question}</div>
    <div class="row" style="margin-top:18px"><button class="btn gold" data-go="step:${nextK}">${started ? "Reprendre là où j'en étais" : "Commencer le parcours"} →</button></div></section>
  <div class="card"><div class="kicker">Mode d'emploi</div><h2 class="stitle">Comment travailler seul ce chapitre</h2><p>${D.guide.intro}</p>
    <div class="steps5">${D.guide.temps.map(([t, d], i) => `<div class="s5" style="--c:${cols[i]}"><b>${i + 1}. ${t}</b><span>${d}</span></div>`).join("")}</div>
    <ul style="margin-top:14px">${D.guide.conseils.map(c => `<li>${c}</li>`).join("")}</ul></div>
  <div class="card"><div class="kicker">Ton parcours</div><h2 class="stitle">Six étapes, dans l'ordre</h2>
    <div class="map">${D.etapes.map(e => { const k = e.k, open = stepOpen(k), done = stepDone(k); const secs = secsOf(k), n = secs.length, d = secs.filter(s => S.checks[s]).length;
      const pct = k === "0" ? (S.prereq ? 100 : 0) : k === "F" ? (S.final ? 100 : 0) : Math.round(100 * (d + (S.exos[k] && Object.keys(S.exos[k].self || {}).length ? 1 : 0)) / (n + 1));
      return `<button class="mapc ${done ? "done" : ""}" data-go="step:${k}" ${open ? "" : "disabled"}><span class="k">${k === "F" ? "★" : k}</span><b>${e.t}</b><span class="mb"><i style="width:${pct}%"></i></span><span class="st">${done ? "Terminée ✓" : open ? (pct ? "En cours · " + pct + " %" : "À faire") : "🔒 Termine l'étape précédente"}</span></button>`; }).join("")}</div></div>
  <div class="card"><div class="kicker">Objectifs</div><h2 class="stitle">À la fin du chapitre, je sais…</h2><ul>${D.obj.map(o => `<li>${o}</li>`).join("")}</ul>
    <h3 style="color:var(--gold);margin-bottom:4px">Prérequis à réactiver</h3><ul>${D.pre.map(o => `<li>${o}</li>`).join("")}</ul></div>`;
}

/* ---------------------------------------------------------------- QCM / VF génériques */
function qHTML(q, id, i, state) {
  const sel = state && state.ans ? state.ans[i] : null, done = state && state.done;
  return `<div class="q" data-q="${i}"><div class="qt">${i + 1}. ${q.q}</div><div class="opts ${q.vf ? "vf" : ""}">${q.o.map((o, j) => {
    const cls = done ? (j === q.a ? "good" : j === sel ? "bad" : "") : "";
    return `<button class="opt ${cls}" type="button" data-j="${j}" aria-pressed="${sel === j}" ${done ? "disabled" : ""}><span class="L">${q.vf ? (j ? "F" : "V") : L[j]}</span><span>${o}</span></button>`; }).join("")}</div>
    ${done ? `<div class="fb ${sel === q.a ? "ok" : "ko"}"><b>${sel === q.a ? "✓ Bonne réponse" : "✗ Réponse attendue : " + (q.vf ? q.o[q.a] : L[q.a] + ". " + q.o[q.a])}</b>${q.e}${q.sec ? ` <button class="linkbtn" data-goto="${q.sec}">Revoir ${q.sec}</button>` : ""}</div>` : ""}</div>`;
}
function wireQs(root, qs, getState, onValidate) {
  $$(".q", root).forEach(qe => { const i = +qe.dataset.q; $$(".opt", qe).forEach(b => b.onclick = () => { const st = getState(); st.ans = st.ans || {}; st.ans[i] = +b.dataset.j; $$(".opt", qe).forEach(x => x.setAttribute("aria-pressed", x === b)); }); });
  const v = $(".js-validate", root);
  if (v) v.onclick = () => { const st = getState(); const ans = st.ans || {}; const miss = qs.findIndex((q, i) => ans[i] == null);
    if (miss >= 0) { $(".msg", root).textContent = `Réponds à toutes les questions avant de valider (question ${miss + 1}).`; return; }
    st.done = true; st.score = qs.filter((q, i) => ans[i] === q.a).length; onValidate(st); };
}

/* ---------------------------------------------------------------- étape 0 */
function step0HTML() {
  const st = S._pre || (S._pre = S.prereq ? { ans: S.prereq.ans, done: true } : {});
  const qs = D.prereq.map(p => ({ q: p.q, o: ["Vrai", "Faux"], a: p.vf ? 0 : 1, e: p.e + (p.revoir ? ` <i>(À revoir si erreur : ${p.revoir})</i>` : ""), vf: true }));
  return `<div class="kicker">Étape 0</div><h2 class="stitle">Point de départ</h2>
  <div class="card"><h3 style="margin:0 0 4px">Ce que je sais déjà</h3><p style="margin:0;color:var(--grey)">Cinq questions sur des notions vues avant ce chapitre. Si tu te trompes, revois la notion indiquée avant de continuer.</p>
    <div class="check" style="margin-top:12px"><div class="ch">✔ Test de prérequis${st.done ? `<span class="score">${st.score ?? S.prereq.score} / 5</span>` : ""}</div>${qs.map((q, i) => qHTML(q, "p", i, st)).join("")}
    ${st.done ? "" : `<div class="row" style="margin-top:10px"><button class="btn js-validate" style="background:var(--violet);border-color:var(--violet)">Valider mes réponses</button></div><div class="msg"></div>`}</div></div>
  <div class="card"><div class="kicker">Introduction du chapitre</div>${D.intro}</div>
  <div class="next"><button class="btn ghost" data-go="home">← Accueil</button><button class="btn" data-go="step:I" ${stepOpen("I") ? "" : "disabled"}>Étape I : les fluctuations →</button></div>`;
}

/* ---------------------------------------------------------------- étapes de cours */
function secUnlocked(k, i) { if (S.free || i === 0) return true; return !!S.checks[D.parts[k].secs[i - 1].key]; }
function checkHTML(key) {
  const qs = D.checks[key], st = S.checks[key] ? Object.assign({}, S.checks[key]) : (S._ck[key] || (S._ck[key] = {}));
  return `<div class="check" data-check="${key}"><div class="ch">✔ Je vérifie · ${key}${st.done ? `<span class="score">${st.score} / ${qs.length}</span>` : ""}</div>
    <p style="margin:6px 0 0;font-size:.9rem;color:var(--grey)">Réponds sans remonter dans le cours. La correction s'affiche après validation.</p>
    ${qs.map((q, i) => qHTML(q, key, i, st)).join("")}
    ${st.done ? `<div class="row" style="margin-top:10px">${st.score < qs.length ? `<span class="msg" style="margin:0">Relis le passage concerné, puis</span>` : `<span class="msg" style="margin:0;color:var(--green)">Parfait, tu peux continuer.</span>`}<button class="btn sm ghost js-retry" data-k="${key}">Recommencer ce « Je vérifie »</button></div>` : `<div class="row" style="margin-top:10px"><button class="btn js-validate" style="background:var(--violet);border-color:var(--violet)">Valider mes réponses</button></div><div class="msg"></div>`}</div>`;
}
function partHTML(k) {
  const P = D.parts[k], E = D.etapes.find(e => e.k === k); S._ck = S._ck || {};
  let html = `<div class="kicker">Étape ${k} · ${E.t}</div><h2 class="stitle">${P.title}</h2>
  <div class="depart"><b>Je découvre — question de départ.</b> ${E.q}
    <textarea class="js-dep" data-k="${k}" placeholder="Ma réponse spontanée, en une ou deux phrases (avant de lire le cours)…">${esc(S.depart[k] || "")}</textarea>
    <div style="margin-top:8px"><b>À la fin de cette étape, je dois être capable de :</b><ul class="caps">${E.cap.map(c => `<li>${D.caps[c][0]}</li>`).join("")}</ul></div></div>
  ${P.pre ? `<div class="card">${P.pre}</div>` : ""}`;
  let allDone = true;
  P.secs.forEach((s, i) => {
    if (!secUnlocked(k, i)) { allDone = false; html += `<div class="locked" id="sec-${s.key}"><span style="font-size:1.5rem">🔒</span><div><b>${s.key} · ${D.sectitles[s.key]}</b><br>Termine « Je vérifie » de la sous-partie précédente pour débloquer la suite.</div></div>`; return; }
    if (!S.checks[s.key]) allDone = false;
    html += `<section class="card sec" id="sec-${s.key}"><span class="secno">${s.key}</span><h3 class="st2">${s.title}</h3><p style="margin:0 0 6px;font-size:.85rem;color:var(--grey)">Je comprends : lis toute la sous-partie, recopie les encadrés ✎, puis reformule-les sans regarder.</p>${s.html}${checkHTML(s.key)}</section>`;
  });
  if (allDone || S.free) {
    const ex = D.exos[k], es = S.exos[k] || {};
    html += `<div class="card">${P.ret}<div class="recall"><b>Retour à ta question de départ.</b> ${E.q}<br><span style="color:var(--grey)">Ta réponse spontanée : </span><i>${S.depart[k] ? esc(S.depart[k]) : "(non renseignée)"}</i><br>Complète-la maintenant avec les notions de la partie.</div></div>
    <div class="card exo"><div class="kicker" style="color:var(--teal)">Je m'entraîne · format bac</div><h3 style="margin:2px 0 0;color:var(--teal)">${ex.titre}</h3>
      <div class="doc"><b class="dt">${ex.doc_titre}</b>${ex.table ? `<div class="tw"><table>${ex.table.map((r, ri) => `<tr>${r.map(c => ri ? `<td>${c}</td>` : `<th>${c}</th>`).join("")}</tr>`).join("")}</table></div>` : `<ul>${ex.lines.map(x => `<li>${x}</li>`).join("")}</ul>`}<div class="src">${ex.source}</div></div>
      <p style="font-size:.9rem;margin:0">Écris ta réponse, puis compare avec le corrigé et évalue-toi honnêtement.</p>
      ${ex.questions.map(([q, r], i) => { const ans = (es.ans || {})[i] || "", shown = (es.shown || {})[i], sv = (es.self || {})[i];
        return `<div class="exq" data-i="${i}"><div class="qt">${i + 1}. ${q}</div><textarea class="js-ea" data-k="${k}" data-i="${i}" placeholder="Ma réponse…">${esc(ans)}</textarea>
        <div class="row" style="margin-top:6px"><button class="btn sm ghost js-show" data-k="${k}" data-i="${i}" ${ans.trim().length >= 20 || shown ? "" : "disabled"}>${shown ? "Corrigé affiché" : "Comparer avec le corrigé"}</button>${!shown ? `<span style="font-size:.8rem;color:var(--grey)">(écris au moins une phrase d'abord)</span>` : ""}</div>
        ${shown ? `<div class="model"><b class="ml">Corrigé</b>${r}</div><div class="self">Mon auto-évaluation : ${[["2", "Réussi"], ["1", "En partie"], ["0", "À revoir"]].map(([v, t]) => `<button data-v="${v}" data-k="${k}" data-i="${i}" class="js-self" aria-pressed="${sv === +v}">${t}</button>`).join("")}</div>` : ""}</div>`; }).join("")}
      ${k === "II" ? `<div class="widget" data-w="game" data-g="1"></div>` : ""}
    </div>
    <div class="card point"><div class="kicker">Je fais le point</div><h3 style="margin:2px 0 6px">Où en suis-je sur cette partie ?</h3>
      ${E.cap.map(c => `<div class="caprow"><span>${D.caps[c][0]} <small style="color:var(--grey)">(${D.caps[c][1]})</small></span><div class="self">${[["2", "Acquis"], ["1", "En cours"], ["0", "À revoir"]].map(([v, t]) => `<button data-v="${v}" data-c="${c}" class="js-cap" aria-pressed="${S.caps[c] === +v}">${t}</button>`).join("")}</div></div>`).join("")}
      <p style="font-size:.85rem;color:var(--grey);margin-bottom:0">« À revoir » : relis la sous-partie indiquée et recommence son « Je vérifie » avant de passer à la suite.</p></div>`;
  }
  const i = ORDER.indexOf(k), nk = ORDER[i + 1], pk = ORDER[i - 1];
  html += `<div class="next"><button class="btn ghost" data-go="step:${pk}">← Étape précédente</button><button class="btn" data-go="step:${nk}" ${stepOpen(nk) ? "" : "disabled"} title="${stepOpen(nk) ? "" : "Termine tous les « Je vérifie », l'exercice et ton auto-évaluation"}">${nk === "F" ? "Étape finale : bilan" : "Étape " + nk} →</button></div>`;
  if (!stepOpen(nk)) html += `<p style="text-align:right;font-size:.85rem;color:var(--grey);margin-top:-14px">Pour passer à la suite : tous les « Je vérifie », puis l'exercice avec au moins une auto-évaluation.</p>`;
  return html;
}

/* ---------------------------------------------------------------- étape finale */
function stepFHTML() {
  const st = S.final ? Object.assign({ done: true }, S.final) : (S._fin || (S._fin = {}));
  let diag = "";
  if (st.done) {
    const by = {};
    D.final.forEach((q, i) => { const c = D.sec2cap[q.sec]; (by[c] ||= [0, 0]); by[c][1]++; if (st.ans[i] === q.a) by[c][0]++; });
    diag = `<div class="diag">${Object.entries(D.caps).map(([c, [t, sec]]) => { const r = by[c], self = S.caps[c]; const pct = r ? r[0] / r[1] : null;
      const lvl = pct == null ? (self === 2 ? "ok" : self === 0 ? "ko" : "mid") : pct === 1 ? "ok" : pct >= .5 ? "mid" : "ko";
      return `<div class="drow"><b>${c}</b><span>${t} ${lvl !== "ok" ? `<button class="linkbtn" data-goto="${sec}">Revoir ${sec}</button>` : ""}</span><span class="tag ${lvl}">${r ? r[0] + " / " + r[1] + " · " : ""}${lvl === "ok" ? "Acquis" : lvl === "mid" ? "À consolider" : "À revoir"}</span></div>`; }).join("")}</div>`;
  }
  const sc = st.done ? st.score : 0, p = Math.round(100 * sc / D.final.length);
  const verdict = sc >= 12 ? "Chapitre maîtrisé : passe à l'argumentation guidée." : sc >= 8 ? "Bases solides : revois les capacités « à consolider » ci-dessous." : "Le chapitre n'est pas encore acquis : reprends les sous-parties indiquées, puis refais le test dans deux jours.";
  const cs = S.calcs || {};
  return `<div class="kicker">Étape finale</div><h2 class="stitle">Bilan et test final</h2>
  <div class="card"><div class="kicker">Conclusion du chapitre</div>${D.concl}</div>
  <div class="card"><div class="kicker" style="color:var(--violet)">Test final · ${D.final.length} questions</div>
    ${st.done ? `<div class="res"><div class="ring" style="--p:${p};--c:${sc >= 12 ? "var(--green)" : sc >= 8 ? "var(--gold)" : "var(--red)"}"><b>${sc} / ${D.final.length}</b></div><div><h3 style="margin:0">${verdict}</h3><p style="margin:.3em 0 0;color:var(--grey)">Diagnostic par capacité (test final + ton auto-évaluation) :</p></div></div>${diag}
      <div class="row noprint" style="margin-top:12px"><button class="btn sm ghost js-redo">Refaire le test</button></div>` : `<p style="margin:4px 0 0;color:var(--grey)">D'une traite, sans le cours. Chaque correction renvoie à la sous-partie à revoir.</p>`}
    <div class="check" style="margin-top:14px">${D.final.map((q, i) => qHTML(q, "f", i, st)).join("")}${st.done ? "" : `<div class="row" style="margin-top:10px"><button class="btn js-validate" style="background:var(--violet);border-color:var(--violet)">Corriger mon test</button></div><div class="msg"></div>`}</div></div>
  <div class="card"><div class="kicker" style="color:var(--teal)">Calculs</div><h3 style="margin:2px 0 6px">Je m'entraîne aux calculs du bac</h3>
    ${D.calcs.map((c, i) => `<div class="calc"><div>${i + 1}. ${c.enonce}</div><div class="row" style="margin-top:6px"><input inputmode="decimal" class="js-calc" data-i="${i}" value="${esc((cs.v || {})[i] ?? "")}" aria-label="Réponse au calcul ${i + 1}"> <span>${c.unite}</span></div>${cs.done ? (() => { const v = parseFloat(String((cs.v || {})[i] || "").replace(",", ".").replace("−", "-")); const ok = Math.abs(v - c.rep) <= c.tol; return `<div class="fb ${ok ? "ok" : "ko"}"><b>${ok ? "✓ Juste" : "✗ À reprendre"}</b>${c.corr}</div>`; })() : ""}</div>`).join("")}
    <div class="row"><button class="btn js-calcs">${cs.done ? "Vérifier à nouveau" : "Vérifier mes calculs"}</button></div></div>
  <div class="card argu"><div class="kicker">Argumentation guidée</div><h3 style="margin:2px 0 0">${D.argu.sujet}</h3><p style="color:var(--grey);margin:.3em 0 0">Construis ton plan détaillé, case par case. Après chaque case, compare avec le modèle.</p>
    ${arguSteps().map((s, i) => { const a = S.argu[i] || {}; return `<div class="stepa"><h4>${s[0]}</h4><p class="hint">${s[1]}</p><textarea class="js-arg" data-i="${i}" placeholder="Ma proposition…">${esc(a.t || "")}</textarea>
      <div class="row" style="margin-top:6px"><button class="btn sm ghost js-argshow" data-i="${i}" ${(a.t || "").trim().length >= 20 || a.s ? "" : "disabled"}>${a.s ? "Modèle affiché" : "Comparer avec le modèle"}</button></div>${a.s ? `<div class="model"><b class="ml">Modèle</b>${s[2]}</div>` : ""}</div>`; }).join("")}</div>
  <div class="card"><div class="kicker">Méthode</div>${D.arc}</div>
  <div class="card"><div class="kicker">Les 18 notions du programme</div><h3 style="margin:2px 0 4px">Cartes de révision</h3><p style="color:var(--grey);margin:0">Lis la notion, donne la définition à voix haute, puis retourne la carte.</p><div class="js-flash"></div></div>
  <div class="card" id="fiche"><div class="kicker">Ma fiche bilan</div><h3 style="margin:2px 0 6px">À imprimer ou à montrer à ton professeur</h3>${ficheHTML()}<div class="row noprint" style="margin-top:12px"><button class="btn js-print">Imprimer ma fiche</button></div></div>
  <div class="next"><button class="btn ghost" data-go="step:IV">← Étape IV</button><button class="btn ghost" data-go="home">Accueil</button></div>`;
}
function arguSteps() {
  const A = D.argu, P = A.parties;
  return [["Introduction", "Définis les termes, pose le problème, annonce ton plan.", A.intro],
    [P[0][0] + " — argument 1", "Pourquoi le budget reste-t-il un levier essentiel ? Un exemple daté.", P[0][1][0]],
    [P[0][0] + " — argument 2", "Quel mécanisme amplifie l'effet du budget ? Un exemple.", P[0][1][1]],
    [P[1][0] + " — argument 1", "Quelle contrainte européenne ? Un exemple chiffré.", P[1][1][0]],
    [P[1][0] + " — argument 2", "Quelle autre limite ? Un exemple.", P[1][1][1]],
    ["Conclusion", "Réponds à la question en nuançant, puis ouvre le sujet.", A.concl]];
}
function ficheHTML() {
  const lab = v => v === 2 ? "Acquis" : v === 1 ? "En cours" : v === 0 ? "À revoir" : "—";
  return `<div class="tw"><table><thead><tr><th>Capacité</th><th>Mon auto-évaluation</th></tr></thead><tbody>${Object.entries(D.caps).map(([c, [t]]) => `<tr><td>${c}</td><td>${t}<br><b>${lab(S.caps[c])}</b></td></tr>`).join("")}</tbody></table></div>
  <div class="tw"><table><thead><tr><th>Sous-partie</th><th>« Je vérifie »</th></tr></thead><tbody>${Object.keys(D.checks).map(k => `<tr><td>${k}</td><td>${D.sectitles[k]} · <b>${S.checks[k] ? S.checks[k].score + " / " + D.checks[k].length : "non fait"}</b></td></tr>`).join("")}
  <tr><td>Test final</td><td><b>${S.final ? S.final.score + " / " + D.final.length : "non fait"}</b></td></tr></tbody></table></div>`;
}

/* ---------------------------------------------------------------- widgets */
function widgets(root) {
  $$(".widget", root).forEach(w => {
    const t = w.dataset.w;
    if (t === "multi") {
      w.innerHTML = `<div class="wt">Simulateur · l'effet multiplicateur</div><p style="margin:0;font-size:.92rem">L'État dépense 10 Md€. Fais varier la part de chaque revenu dépensée en produits nationaux (le reste « fuit » : épargne, impôts, importations).</p>
        <label style="display:block;margin-top:8px;font-weight:600">Part dépensée : <span class="js-c">40</span> %<input type="range" min="10" max="80" step="5" value="40" class="js-r" aria-label="Part dépensée"></label>
        <div class="waves"></div><div class="kpis"><div class="kpi"><b class="js-t">16,7 Md€</b><span>production totale</span></div><div class="kpi"><b class="js-m">1,67</b><span>multiplicateur</span></div></div>`;
      const r = $(".js-r", w), paint = () => { const c = r.value / 100; $(".js-c", w).textContent = r.value; const v = Array.from({ length: 8 }, (_, i) => 10 * c ** i);
        $(".waves", w).innerHTML = v.map((x, i) => `<div style="height:${x * 13}px" title="Vague ${i + 1}"><span>${x.toFixed(1).replace(".", ",")}</span></div>`).join("");
        const tot = 10 / (1 - c); $(".js-t", w).textContent = tot.toFixed(1).replace(".", ",") + " Md€"; $(".js-m", w).textContent = (1 / (1 - c)).toFixed(2).replace(".", ","); };

    if (t === "carre") {

        <div class="gauges">${G.map(g => `<div class="gauge"><i>•</i><b>${g}</b></div>`).join("")}</div><div class="wexp">Clique sur une politique.</div>`;
      const E = { up: [["up", "up", "dn", "dn"], "Relance : la croissance et l'emploi s'améliorent, mais les prix accélèrent et les importations augmentent : l'équilibre extérieur se dégrade."],
                  dn: [["dn", "dn", "up", "up"], "Freinage : les prix se stabilisent et les importations reculent, mais la croissance ralentit et le chômage augmente."] };
      $$(".js-a", w).forEach(b => b.onclick = () => { const [st, txt] = E[b.dataset.a]; $$(".gauge", w).forEach((g, i) => { g.className = "gauge " + st[i]; $("i", g).textContent = st[i] === "up" ? "▲" : "▼"; }); $(".wexp", w).textContent = txt + " Aucun choix ne remplit les quatre objectifs : c'est un arbitrage."; $$(".js-a", w).forEach(x => x.classList.toggle("ghost", x !== b)); });
    }
    if (t === "criteres") {
      const rows = [["Déficit 2025", 5.1, 3, 10], ["Déficit 2026", 5.4, 3, 10], ["Déficit 2027", 5.0, 3, 10], ["Dette 2025", 115.6, 60, 130], ["Dette 2026", 119.3, 60, 130], ["Dette 2027", 121.7, 60, 130]];
      w.innerHTML = `<div class="wt">Visualiser · la France face aux critères</div><p style="margin:0;font-size:.92rem">Le trait vert marque le seuil européen.</p><div class="crit">${rows.map(([l, v, s, mx]) => `<div class="crow"><span>${l}</span><div class="ctrack"><i data-w="${100 * v / mx}">${String(v).replace(".", ",")} %</i><em style="left:${100 * s / mx}%"><span>${s} %</span></em></div></div>`).join("")}</div>

      const run = () => { $$(".ctrack i", w).forEach(i => i.style.width = "0"); setTimeout(() => $$(".ctrack i", w).forEach((i, k) => setTimeout(() => i.style.width = i.dataset.w + "%", k * 150)), 60); };

        const err = g.items.filter((it, i) => st.a[i] !== it[1]).length; st.ok = !err; save();
        res.className = "gres " + (err ? "ko" : "ok"); res.textContent = err ? `${err} erreur${err > 1 ? "s" : ""}. Repère-les toi-même (qui bénéficie ? pour combien de temps ?), corrige, puis vérifie à nouveau.` : "Tout est bon ! Tu sais classer une mesure."; };

function observe(el, fn) { if (!("IntersectionObserver" in window)) { fn(); return; } const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { fn(); io.disconnect(); } }), { threshold: .35 }); io.observe(el); }
function flash(root) {
  const host = $(".js-flash", root); if (!host) return;
  const F = S.flash, n = D.lex.length;
  const paint = () => { const [t, d] = D.lex[F.i % n];
    host.innerHTML = `<div class="flash"><div class="fcard"><div class="fface front">${t}<small>Touche la carte pour la retourner · ${F.i % n + 1} / ${n}</small></div><div class="fface back">${d}</div></div></div>
      <div class="fnav"><button class="btn sm ghost js-fp">←</button><button class="btn sm ghost js-fk" style="border-color:var(--red);color:var(--red)">À revoir</button><button class="btn sm js-fy" style="background:var(--green);border-color:var(--green)">Je savais</button><button class="btn sm ghost js-fn">→</button><span style="font-size:.85rem;color:var(--grey)">${F.know.length} / ${n} sues</span></div>`;
    $(".fcard", host).onclick = e => e.currentTarget.classList.toggle("flip");
    $(".js-fp", host).onclick = () => { F.i = (F.i - 1 + n) % n; save(); paint(); };
    $(".js-fn", host).onclick = () => { F.i = (F.i + 1) % n; save(); paint(); };
    $(".js-fy", host).onclick = () => { const k = F.i % n; if (!F.know.includes(k)) F.know.push(k); F.i = (F.i + 1) % n; save(); paint(); };
    $(".js-fk", host).onclick = () => { const k = F.i % n; F.know = F.know.filter(x => x !== k); F.i = (F.i + 1) % n; save(); paint(); }; };
  paint();
}

/* ---------------------------------------------------------------- câblage */
function gotoSec(sec) { const k = sec.split(".")[0]; if (!stepOpen(k)) { S.free = true; } go("step:" + k, "sec-" + sec); }
function wire(m) {
  $$("[data-go]", m).forEach(b => b.onclick = () => go(b.dataset.go));
  $$("[data-goto]", m).forEach(b => b.onclick = () => gotoSec(b.dataset.goto));
  // étape 0
  if (S.route === "step:0") { const qs = D.prereq.map(p => ({ a: p.vf ? 0 : 1 })); wireQs(m, qs, () => S._pre, st => { S.prereq = { ans: st.ans, score: st.score }; save(); toast(`Point de départ : ${st.score} / 5`); render(); }); }
  // je vérifie
  $$(".check[data-check]", m).forEach(c => { const key = c.dataset.check; wireQs(c, D.checks[key], () => S._ck[key], st => { S.checks[key] = { ans: st.ans, score: st.score, done: true }; delete S._ck[key]; save(); toast(`Je vérifie ${key} : ${st.score} / ${D.checks[key].length}`); const y = window.scrollY; render(); window.scrollTo(0, y); }); });
  $$(".js-retry", m).forEach(b => b.onclick = () => { delete S.checks[b.dataset.k]; S._ck[b.dataset.k] = {}; save(); const y = window.scrollY; render(); window.scrollTo(0, y); });
  // départ
  $$(".js-dep", m).forEach(t => t.oninput = () => { S.depart[t.dataset.k] = t.value; save(); });
  // exercices
  $$(".js-ea", m).forEach(t => t.oninput = () => { const e = (S.exos[t.dataset.k] ||= {}); (e.ans ||= {})[t.dataset.i] = t.value; save(); const b = $(`.js-show[data-k="${t.dataset.k}"][data-i="${t.dataset.i}"]`, m); if (b && !(e.shown || {})[t.dataset.i]) b.disabled = t.value.trim().length < 20; });
  $$(".js-show", m).forEach(b => b.onclick = () => { const e = (S.exos[b.dataset.k] ||= {}); (e.shown ||= {})[b.dataset.i] = 1; save(); const y = window.scrollY; render(); window.scrollTo(0, y); });
  $$(".js-self", m).forEach(b => b.onclick = () => { const e = (S.exos[b.dataset.k] ||= {}); (e.self ||= {})[b.dataset.i] = +b.dataset.v; save(); $$(`.js-self[data-k="${b.dataset.k}"][data-i="${b.dataset.i}"]`, m).forEach(x => x.setAttribute("aria-pressed", x === b)); nav(); const nb = $$(".next .btn", m).pop(); const k = b.dataset.k, nk = ORDER[ORDER.indexOf(k) + 1]; if (nb && stepOpen(nk)) nb.disabled = false; });
  $$(".js-cap", m).forEach(b => b.onclick = () => { S.caps[b.dataset.c] = +b.dataset.v; save(); $$(`.js-cap[data-c="${b.dataset.c}"]`, m).forEach(x => x.setAttribute("aria-pressed", x === b)); });
  // final
  if (S.route === "step:F") {
    wireQs(m, D.final, () => S._fin, st => { S.final = { ans: st.ans, score: st.score }; delete S._fin; save(); render(); window.scrollTo(0, 0); });
    const rd = $(".js-redo", m); if (rd) rd.onclick = () => { S.final = null; S._fin = {}; save(); render(); };
    $$(".js-calc", m).forEach(i => i.oninput = () => { const c = (S.calcs ||= {}); (c.v ||= {})[i.dataset.i] = i.value; save(); });
    $(".js-calcs", m).onclick = () => { (S.calcs ||= {}).done = true; save(); const y = window.scrollY; render(); window.scrollTo(0, y); };
    $$(".js-arg", m).forEach(t => t.oninput = () => { const a = (S.argu[t.dataset.i] ||= {}); a.t = t.value; save(); const b = $(`.js-argshow[data-i="${t.dataset.i}"]`, m); if (b && !a.s) b.disabled = t.value.trim().length < 20; });
    $$(".js-argshow", m).forEach(b => b.onclick = () => { (S.argu[b.dataset.i] ||= {}).s = 1; save(); const y = window.scrollY; render(); window.scrollTo(0, y); });
    $(".js-print", m).onclick = () => window.print();
    flash(m);
  }
  // animations
  $$("figure.anim", m).forEach(f => { $$(".dot,text.b", f).forEach((e, i) => e.style.setProperty("--i", i)); observe(f, () => f.classList.add("on")); const r = $(".js-replay", f); r.onclick = () => { f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); }; });
  $$("[data-chain]", m).forEach(c => { const st = $$(".cst", c); let n = 0; const show = () => { st.forEach((e, i) => e.classList.toggle("on", i < n)); $(".js-cnext", c).disabled = n >= st.length; };
    $(".js-cnext", c).onclick = () => { n++; show(); }; $(".js-call", c).onclick = () => { n = st.length; show(); }; n = 1; show(); });
  widgets(m);
}
